<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Над овцой — симулятор</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Rubik","Fredoka",system-ui,sans-serif;color:#ffffff}
.o{-webkit-text-stroke:6px #000000;paint-order:stroke fill;text-shadow:0 4px 0 #000000}
.o2{-webkit-text-stroke:4px #000000;paint-order:stroke fill;text-shadow:0 2px 0 #000000}
.stripes{background-image:repeating-linear-gradient(-45deg,#ffffff33 0 8px,transparent 8px 16px)}
</style>
</head>
<body>
<div style="width: 1100px; height: 320px; box-sizing: border-box; padding: 28px 40px; background: #8fd3ff; display: flex; align-items: flex-start; gap: 40px; font-family: Rubik, Fredoka, system-ui, sans-serif; color: #ffffff">

<div style="width: 300px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="font-size: 14px; font-weight: 800; color: #0c2a70">Норма</div>
<div class="o2" style="font-size: 20px; font-weight: 900">ОВЦА <span style="color: #ffd21f">УР.2</span></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 26px 8px 12px; background: linear-gradient(180deg, #7df06a, #22a83a); border: 5px solid #000000; border-radius: 999px; box-shadow: inset 0 5px 0 #ffffff77, 0 6px 0 #000000">
<svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#ffd21f" stroke="#000000" stroke-width="2.2"></circle><circle cx="12" cy="12" r="6.5" fill="#ffb300" stroke="#c77800" stroke-width="1.5"></circle><path d="M6.5 8.5a6.5 6.5 0 0 1 4-3.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"></path></svg>
<div class="o" style="font-size: 44px; line-height: 50px; font-weight: 900">+37<span style="font-size: 24px">/ч</span></div>
</div>
<div style="width: 200px; height: 22px; box-sizing: border-box; background: #0c2a70; border: 4px solid #000000; border-radius: 11px; overflow: hidden"><div class="stripes" style="height: 100%; width: 80%; background-color: #ffa51f; box-shadow: inset 0 4px 0 #ffffff55"></div></div>
</div>

<div style="width: 300px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="font-size: 14px; font-weight: 800; color: #0c2a70">Голодна</div>
<div class="o2" style="font-size: 20px; font-weight: 900; color: #ff5a4a; transform: rotate(-3deg)">ГОЛОДНА!</div>
<div style="position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 26px 8px 12px; background: linear-gradient(180deg, #ff8a7a, #e0302a); border: 5px solid #000000; border-radius: 999px; box-shadow: inset 0 5px 0 #ffffff77, 0 6px 0 #000000">
<svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#ffd21f" stroke="#000000" stroke-width="2.2"></circle><circle cx="12" cy="12" r="6.5" fill="#ffb300" stroke="#c77800" stroke-width="1.5"></circle><path d="M6.5 8.5a6.5 6.5 0 0 1 4-3.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"></path></svg>
<div class="o" style="font-size: 44px; line-height: 50px; font-weight: 900">+18<span style="font-size: 24px">/ч</span></div>
<div class="o2" style="position: absolute; top: -18px; right: -22px; padding: 2px 10px; background: #ffd21f; border: 4px solid #000000; border-radius: 12px; transform: rotate(12deg); font-size: 18px; font-weight: 900">x0.5</div>
</div>
<div style="width: 200px; height: 22px; box-sizing: border-box; background: #0c2a70; border: 4px solid #000000; border-radius: 11px; overflow: hidden"><div class="stripes" style="height: 100%; width: 12%; background-color: #ff4a3a; box-shadow: inset 0 4px 0 #ffffff55"></div></div>
</div>

<div style="width: 300px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="font-size: 14px; font-weight: 800; color: #0c2a70">Издалека (компакт)</div>
<div style="margin-top: 34px; display: flex; align-items: center; gap: 6px; padding: 4px 16px 4px 6px; background: linear-gradient(180deg, #7df06a, #22a83a); border: 4px solid #000000; border-radius: 999px; box-shadow: inset 0 4px 0 #ffffff77, 0 4px 0 #000000">
<svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#ffd21f" stroke="#000000" stroke-width="2.2"></circle><circle cx="12" cy="12" r="6.5" fill="#ffb300" stroke="#c77800" stroke-width="1.5"></circle></svg>
<div class="o2" style="font-size: 28px; line-height: 32px; font-weight: 900">+37</div>
</div>
</div>

</div>
</body>
</html>
