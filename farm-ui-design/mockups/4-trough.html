<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Над корытом — симулятор</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Rubik","Fredoka",system-ui,sans-serif;color:#ffffff}
.o{-webkit-text-stroke:6px #000000;paint-order:stroke fill;text-shadow:0 4px 0 #000000}
.o2{-webkit-text-stroke:4px #000000;paint-order:stroke fill;text-shadow:0 2px 0 #000000}
.stripes{background-image:repeating-linear-gradient(-45deg,#ffffff33 0 10px,transparent 10px 20px)}
</style>
</head>
<body>
<div style="width: 820px; height: 360px; box-sizing: border-box; padding: 28px 40px; background: #8fd3ff; display: flex; align-items: flex-start; gap: 40px; font-family: Rubik, Fredoka, system-ui, sans-serif; color: #ffffff">

<div style="width: 350px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="font-size: 14px; font-weight: 800; color: #0c2a70">Норма</div>
<div style="width: 350px; box-sizing: border-box; padding: 16px; background: linear-gradient(180deg, #5fd0ff, #1f7fe0); border: 5px solid #000000; border-radius: 24px; box-shadow: inset 0 0 0 4px #ffffff55, 0 7px 0 #000000; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5S3.8 10.8 3.8 15.5a8.2 8.2 0 0 0 16.4 0C20.2 10.8 12 1.5 12 1.5z" fill="#2ec8ff" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"></path><path d="M8.3 15.2a3.7 3.7 0 0 0 2.7 3.7" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg>
<div class="o" style="flex-grow: 1; font-size: 28px; line-height: 32px; font-weight: 900">КОРЫТО</div>
<div class="o2" style="font-size: 26px; font-weight: 900">64<span style="font-size: 16px">/100 Л</span></div>
</div>
<div style="height: 40px; box-sizing: border-box; background: #0c2a70; border: 4px solid #000000; border-radius: 20px; overflow: hidden"><div class="stripes" style="height: 100%; width: 64%; background-color: #2ec8ff; border-radius: 16px; box-shadow: inset 0 6px 0 #ffffff66"></div></div>
<div class="o2" style="text-align: center; font-size: 16px; font-weight: 900">ХВАТИТ НА ~18 МИН</div>
</div>
</div>

<div style="width: 350px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="font-size: 14px; font-weight: 800; color: #0c2a70">Мало воды</div>
<div style="position: relative; width: 350px; box-sizing: border-box; padding: 16px; background: linear-gradient(180deg, #5fd0ff, #1f7fe0); border: 5px solid #000000; border-radius: 24px; box-shadow: inset 0 0 0 4px #ffffff55, 0 7px 0 #000000; display: flex; flex-direction: column; gap: 12px">
<div class="o2" style="position: absolute; top: -20px; right: -14px; padding: 4px 12px; background: linear-gradient(180deg, #ff8a7a, #e0302a); border: 4px solid #000000; border-radius: 12px; transform: rotate(8deg); font-size: 18px; font-weight: 900">ДОЛЕЙ ВОДЫ!</div>
<div style="display: flex; align-items: center; gap: 10px">
<svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5S3.8 10.8 3.8 15.5a8.2 8.2 0 0 0 16.4 0C20.2 10.8 12 1.5 12 1.5z" fill="#2ec8ff" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"></path><path d="M8.3 15.2a3.7 3.7 0 0 0 2.7 3.7" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg>
<div class="o" style="flex-grow: 1; font-size: 28px; line-height: 32px; font-weight: 900">КОРЫТО</div>
<div class="o2" style="font-size: 26px; font-weight: 900; color: #ff5a4a">8<span style="font-size: 16px; color: #ffffff">/100 Л</span></div>
</div>
<div style="height: 40px; box-sizing: border-box; background: #0c2a70; border: 4px solid #000000; border-radius: 20px; overflow: hidden"><div class="stripes" style="height: 100%; width: 10%; background-color: #ff4a3a; border-radius: 16px; box-shadow: inset 0 6px 0 #ffffff66"></div></div>
<div style="display: flex; align-items: center; justify-content: center; gap: 10px">
<div class="o" style="width: 40px; height: 40px; box-sizing: border-box; background: #ffffff; border: 4px solid #000000; border-radius: 10px; box-shadow: 0 4px 0 #000000; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; -webkit-text-stroke: 0; text-shadow: none; color: #000000">E</div>
<div class="o2" style="font-size: 20px; font-weight: 900">НАЛИТЬ</div>
</div>
</div>
</div>

</div>
</body>
</html>
