<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Над рабочим — симулятор</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Rubik","Fredoka",system-ui,sans-serif;color:#ffffff}
.o{-webkit-text-stroke:6px #000000;paint-order:stroke fill;text-shadow:0 4px 0 #000000}
.o2{-webkit-text-stroke:4px #000000;paint-order:stroke fill;text-shadow:0 2px 0 #000000}
</style>
</head>
<body>
<div style="width: 820px; height: 360px; box-sizing: border-box; padding: 28px 40px; background: #8fd3ff; display: flex; align-items: flex-start; gap: 40px; font-family: Rubik, Fredoka, system-ui, sans-serif; color: #ffffff">

<div style="width: 350px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="font-size: 14px; font-weight: 800; color: #0c2a70">Работает</div>
<div style="width: 350px; box-sizing: border-box; padding: 16px; background: linear-gradient(180deg, #c98bff, #7a2fe0); border: 5px solid #000000; border-radius: 24px; box-shadow: inset 0 0 0 4px #ffffff44, 0 7px 0 #000000; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 56px; height: 56px; background: #ffffff; border: 4px solid #000000; border-radius: 16px; display: flex; align-items: center; justify-content: center">
<svg width="42" height="42" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 23c0-5 3.8-8 8.5-8s8.5 3 8.5 8z" fill="#3aa0ff" stroke="#000000" stroke-width="2"></path><circle cx="12" cy="10" r="4.3" fill="#ffd2a6" stroke="#000000" stroke-width="2"></circle><ellipse cx="12" cy="6.2" rx="7.5" ry="2" fill="#ffcf5c" stroke="#000000" stroke-width="1.8"></ellipse><path d="M8.5 6C8.5 2.5 15.5 2.5 15.5 6z" fill="#ffcf5c" stroke="#000000" stroke-width="1.8"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div class="o" style="font-size: 28px; line-height: 32px; font-weight: 900">ПАСТУХ</div>
<div class="o2" style="font-size: 15px; font-weight: 900; color: #7df06a">КОРМИТ ОВЕЦ</div>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 16px; background: #3a1580; border: 4px solid #000000; border-radius: 999px">
<div class="o2" style="font-size: 16px; font-weight: 900">ЗАРПЛАТА</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 2px 14px 2px 4px; background: #ffffff; border: 3px solid #000000; border-radius: 999px">
<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#ffd21f" stroke="#000000" stroke-width="2.2"></circle><circle cx="12" cy="12" r="6.5" fill="#ffb300" stroke="#c77800" stroke-width="1.5"></circle></svg>
<div class="o2" style="font-size: 24px; font-weight: 900; color: #ffd21f">25/ч</div>
</div>
</div>
<div class="o2" style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 900">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#ffffff" stroke="#000000" stroke-width="2.5"></circle><path d="M12 7v5l3 2" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"></path></svg>
ВЫПЛАТА ЧЕРЕЗ 12:40
</div>
</div>
</div>

<div style="width: 350px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="font-size: 14px; font-weight: 800; color: #0c2a70">Не хватает на зарплату</div>
<div style="position: relative; width: 350px; box-sizing: border-box; padding: 16px; background: linear-gradient(180deg, #a3a8b8, #5d6275); border: 5px solid #000000; border-radius: 24px; box-shadow: inset 0 0 0 4px #ffffff44, 0 7px 0 #000000; display: flex; flex-direction: column; gap: 12px">
<div class="o2" style="position: absolute; top: -20px; right: -14px; padding: 4px 12px; background: linear-gradient(180deg, #ff8a7a, #e0302a); border: 4px solid #000000; border-radius: 12px; transform: rotate(8deg); font-size: 18px; font-weight: 900">БАСТУЕТ!</div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 56px; height: 56px; background: #d7dae3; border: 4px solid #000000; border-radius: 16px; display: flex; align-items: center; justify-content: center">
<svg width="42" height="42" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 23c0-5 3.8-8 8.5-8s8.5 3 8.5 8z" fill="#3aa0ff" stroke="#000000" stroke-width="2"></path><circle cx="12" cy="10" r="4.3" fill="#ffd2a6" stroke="#000000" stroke-width="2"></circle><ellipse cx="12" cy="6.2" rx="7.5" ry="2" fill="#ffcf5c" stroke="#000000" stroke-width="1.8"></ellipse><path d="M8.5 6C8.5 2.5 15.5 2.5 15.5 6z" fill="#ffcf5c" stroke="#000000" stroke-width="1.8"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div class="o" style="font-size: 28px; line-height: 32px; font-weight: 900">ПАСТУХ</div>
<div class="o2" style="font-size: 15px; font-weight: 900; color: #ff5a4a">НЕ РАБОТАЕТ</div>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 16px; background: #3b3f4d; border: 4px solid #000000; border-radius: 999px">
<div class="o2" style="font-size: 16px; font-weight: 900">ДОЛГ</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 2px 14px 2px 4px; background: #ffffff; border: 3px solid #000000; border-radius: 999px">
<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#ffd21f" stroke="#000000" stroke-width="2.2"></circle><circle cx="12" cy="12" r="6.5" fill="#ffb300" stroke="#c77800" stroke-width="1.5"></circle></svg>
<div class="o2" style="font-size: 24px; font-weight: 900; color: #ff5a4a">50</div>
</div>
</div>
<button class="o2" style="height: 54px; background: linear-gradient(180deg, #7df06a 0%, #22a83a 100%); color: #ffffff; border: 5px solid #000000; border-radius: 18px; box-shadow: inset 0 5px 0 #ffffff77, 0 5px 0 #000000; font-family: inherit; font-size: 22px; font-weight: 900; cursor: pointer">ВЫПЛАТИТЬ</button>
</div>
</div>

</div>
</body>
</html>
