<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #16181d; font-family: 'Fredoka', sans-serif; font-weight: 700; }
  a { color: #7fb4ff; } a:hover { color: #a8ccff; }
  @keyframes dsBg { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes dsOutBg { 0% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes dsOutItem { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.55); opacity: 0; } }
  @keyframes dsDrop { 0% { transform: scale(3); opacity: 0; } 55% { transform: scale(0.92); opacity: 1; } 75% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes dsRise { 0% { transform: translateY(2em); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  @keyframes dsPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes dsTear { 0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; } 30% { transform: translate(0, -0.8em) rotate(-10deg) scale(1.2); opacity: 1; } 100% { transform: translate(0.6em, -9em) rotate(28deg) scale(0.5); opacity: 0; } }
  @keyframes dsCrack { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes dsBadgeGrey { 0% { background-color: #E5484D; } 100% { background-color: #3A3F4A; } }
  @keyframes dsBreak { 0% { transform: scale(1) rotate(0deg); opacity: 1; } 35% { transform: scale(1.22) rotate(-7deg); opacity: 1; } 65% { transform: scale(0.9) rotate(5deg); opacity: 1; } 100% { transform: scale(0.6) rotate(0deg); opacity: 0; } }
  @keyframes dsShard { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-5em) rotate(280deg); opacity: 0; } }
  @keyframes dsVig { 0% { opacity: 0.45; } 100% { opacity: 1; } }
  @keyframes dsBtnPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes dsRevive { 0% { transform: scale(0.3) rotate(-20deg); opacity: 0; } 50% { transform: scale(1.3) rotate(6deg); opacity: 1; } 70% { transform: scale(0.95) rotate(-2deg); } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
  @keyframes dsBeat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
  @keyframes dsSpark { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-7em) scale(0.2); opacity: 0; } }
  @keyframes dsFill { 0% { width: 0%; } 100% { width: 100%; } }
  @keyframes dsGreenBg { 0% { opacity: 0; } 30% { opacity: 0.28; } 100% { opacity: 0; } }
  @keyframes dsLobbyDots { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  @keyframes dsBob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 30px;">
  <div style="width: 760px; height: {{ wrapH }}px; position: relative; overflow: hidden; border-radius: 12px;">
    <div style="position: absolute; left: 0; top: 0; width: {{ W }}px; height: {{ H }}px; transform: scale({{ scale }}); transform-origin: 0 0; font-size: {{ baseFs }}px; overflow: hidden; background: linear-gradient(180deg, #3d92c4 0%, #14517d 100%);">

      <!-- dark overlay -->
      <sc-if value="{{ dimOn }}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; inset: 0; z-index: 1; background: #0B1A2A; opacity: 0.6; animation: {{ bgAnim }};"></div>
      </sc-if>
      <!-- red vignette -->
      <sc-if value="{{ isDeath }}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; inset: 0; z-index: 1; pointer-events: none; animation: dsVig 0.9s ease-in-out infinite alternate;">
          <div style="position: absolute; left: 0; right: 0; top: 0; height: 22%; background: linear-gradient(180deg, rgba(229,72,77,0.55), rgba(229,72,77,0));"></div>
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: linear-gradient(0deg, rgba(229,72,77,0.55), rgba(229,72,77,0));"></div>
          <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 14%; background: linear-gradient(90deg, rgba(229,72,77,0.55), rgba(229,72,77,0));"></div>
          <div style="position: absolute; top: 0; bottom: 0; right: 0; width: 14%; background: linear-gradient(270deg, rgba(229,72,77,0.55), rgba(229,72,77,0));"></div>
        </div>
      </sc-if>
      <!-- green revive flash -->
      <sc-if value="{{ isRevive }}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; inset: 0; z-index: 1; pointer-events: none; background: #7AE04D; opacity: 0; animation: dsGreenBg 0.9s ease-out 0.2s both;"></div>
      </sc-if>

      <!-- HUD replica: HP bar (bottom-left) -->
      <div style="position: absolute; left: 1.8%; bottom: 5%; z-index: 2; width: 21%; display: flex; align-items: center;">
        <div style="position: relative; width: 4.6em; height: 4.6em; flex: none; border-radius: 50%; background-color: {{ badgeColor }}; border: 3px solid #9E1F1F; z-index: 1; margin-right: -1.4em; box-shadow: 0 3px 0 #701414; animation: {{ badgeAnim }};">
          <div style="position: absolute; left: 50%; top: 50%; width: 1em; height: 0.85em; font-size: 2.7em; margin-left: -0.5em; margin-top: -0.42em; animation: {{ tearAnim }};">
            <div style="position: absolute; inset: 0; transform: scale(1.16); transform-origin: 50% 55%;">
              <div style="position: absolute; left: 0.25em; top: 0.2em; width: 0.5em; height: 0.5em; background: #14261A; transform: rotate(45deg);"></div>
              <div style="position: absolute; left: 0.073em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #14261A;"></div>
              <div style="position: absolute; left: 0.427em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #14261A;"></div>
            </div>
            <div style="position: absolute; inset: 0;">
              <div style="position: absolute; left: 0.25em; top: 0.2em; width: 0.5em; height: 0.5em; background: #E5484D; transform: rotate(45deg);"></div>
              <div style="position: absolute; left: 0.073em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #E5484D;"></div>
              <div style="position: absolute; left: 0.427em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #E5484D;"></div>
              <div style="position: absolute; left: 0.2em; top: 0.14em; width: 0.15em; height: 0.15em; border-radius: 50%; background: rgba(255,255,255,0.6);"></div>
            </div>
            <div style="position: absolute; left: 0.47em; top: 0.12em; width: 0.06em; height: 0.24em; background: #14261A; transform: rotate(18deg); opacity: 0; animation: {{ crack1 }};"></div>
            <div style="position: absolute; left: 0.5em; top: 0.32em; width: 0.06em; height: 0.2em; background: #14261A; transform: rotate(-24deg); opacity: 0; animation: {{ crack2 }};"></div>
            <div style="position: absolute; left: 0.46em; top: 0.48em; width: 0.06em; height: 0.2em; background: #14261A; transform: rotate(14deg); opacity: 0; animation: {{ crack3 }};"></div>
          </div>
          <sc-for list="{{ tearShards }}" as="p" hint-placeholder-count="1">
            <div style="position: absolute; left: 50%; top: 45%; width: 0; height: 0; transform: rotate({{ p.rot }}deg);">
              <div style="position: absolute; left: -0.3rem; top: -0.3rem; width: 0.6rem; height: 0.6rem; background: #E5484D; border-radius: {{ p.radius }}; font-size: {{ p.fs }}rem; opacity: 0; animation: {{ p.anim }};"></div>
            </div>
          </sc-for>
        </div>
        <div style="flex: 1; height: 2.8em; border-radius: 999px; background: #701414; border: 3px solid #9E1F1F; position: relative; box-shadow: 0 4px 0 rgba(0,0,0,0.25);">
          <div style="position: absolute; top: 2px; bottom: 2px; left: 2px; right: 2px; overflow: hidden; border-radius: 999px;">
            <div style="height: 100%; width: {{ hpW }}; border-radius: 999px; background: linear-gradient(180deg, #FF7561, #D92F2F); animation: {{ hpAnim }};"></div>
          </div>
          <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.5em; text-shadow: 0 2px 0 #14261A;">{{ hpText }}</span>
        </div>
      </div>

      <!-- DEATH: crew lives row; offer only when lives are gone -->
      <sc-if value="{{ isDeath }}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 1.8em; animation: {{ deathOut }};">
          <div style="display: flex; align-items: center; gap: 3.2em; position: relative;">
            <sc-for list="{{ lives }}" as="l" hint-placeholder-count="3">
              <div style="position: relative; width: 1em; height: 0.85em; font-size: 12em;">
                <div style="position: absolute; inset: 0; animation: {{ l.outlineAnim }};">
                  <div style="position: absolute; inset: 0; transform: scale(1.16); transform-origin: 50% 55%;">
                    <div style="position: absolute; left: 0.25em; top: 0.2em; width: 0.5em; height: 0.5em; background: #3A3F4A; transform: rotate(45deg);"></div>
                    <div style="position: absolute; left: 0.073em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #3A3F4A;"></div>
                    <div style="position: absolute; left: 0.427em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #3A3F4A;"></div>
                  </div>
                  <div style="position: absolute; inset: 0;">
                    <div style="position: absolute; left: 0.25em; top: 0.2em; width: 0.5em; height: 0.5em; background: #0F1D2C; transform: rotate(45deg);"></div>
                    <div style="position: absolute; left: 0.073em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #0F1D2C;"></div>
                    <div style="position: absolute; left: 0.427em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #0F1D2C;"></div>
                  </div>
                </div>
                <div style="position: absolute; inset: 0; opacity: {{ l.redOpacity }}; animation: {{ l.anim }};">
                  <div style="position: absolute; inset: 0; transform: scale(1.16); transform-origin: 50% 55%;">
                    <div style="position: absolute; left: 0.25em; top: 0.2em; width: 0.5em; height: 0.5em; background: #14261A; transform: rotate(45deg);"></div>
                    <div style="position: absolute; left: 0.073em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #14261A;"></div>
                    <div style="position: absolute; left: 0.427em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #14261A;"></div>
                  </div>
                  <div style="position: absolute; inset: 0;">
                    <div style="position: absolute; left: 0.25em; top: 0.2em; width: 0.5em; height: 0.5em; background: #E5484D; transform: rotate(45deg);"></div>
                    <div style="position: absolute; left: 0.073em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #E5484D;"></div>
                    <div style="position: absolute; left: 0.427em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #E5484D;"></div>
                    <div style="position: absolute; left: 0.2em; top: 0.14em; width: 0.15em; height: 0.15em; border-radius: 50%; background: rgba(255,255,255,0.6);"></div>
                  </div>
                  <div style="position: absolute; left: 0.47em; top: 0.12em; width: 0.06em; height: 0.24em; background: #14261A; transform: rotate(18deg); opacity: 0; animation: {{ l.crack1 }};"></div>
                  <div style="position: absolute; left: 0.5em; top: 0.32em; width: 0.06em; height: 0.2em; background: #14261A; transform: rotate(-24deg); opacity: 0; animation: {{ l.crack2 }};"></div>
                  <div style="position: absolute; left: 0.46em; top: 0.48em; width: 0.06em; height: 0.2em; background: #14261A; transform: rotate(14deg); opacity: 0; animation: {{ l.crack3 }};"></div>
                </div>
              </div>
            </sc-for>
            <div style="position: absolute; left: 50%; top: 40%; width: 0; height: 0; margin-left: {{ breakX }}em;">
              <sc-for list="{{ breakShards }}" as="q" hint-placeholder-count="1">
                <div style="position: absolute; left: 0; top: 0; width: 0; height: 0; transform: rotate({{ q.rot }}deg);">
                  <div style="position: absolute; left: -0.5rem; top: -0.5rem; width: 1rem; height: 1rem; background: #E5484D; border-radius: {{ q.radius }}; font-size: {{ q.fs }}rem; opacity: 0; animation: {{ q.anim }};"></div>
                </div>
              </sc-for>
            </div>
          </div>
          <span style="color: #fff; font-size: {{ titleSize }}em; line-height: 1; white-space: nowrap; text-shadow: 0 3px 0 #14261A, 0 6px 0 rgba(0,0,0,0.35); animation: dsDrop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 1.15s both;">{{ title }}</span>
          <span style="color: #fff; font-size: 3.4em; line-height: 1.2; white-space: nowrap; text-shadow: 0 2px 0 #14261A; animation: dsRise 0.5s ease-out 1.7s both;">{{ caption }}</span>
          <!-- buttons: only when out of lives -->
          <sc-if value="{{ offer }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; gap: 2.4em; align-items: center; animation: dsRise 0.5s ease-out 2s both;">
            <button onClick="{{ onBuy }}" style="font-family: inherit; font-weight: 700; color: #fff; font-size: 3.6em; line-height: 1; background: linear-gradient(180deg, #7AE04D, #48B428); border: 3px solid #14261A; border-radius: 0.5em; padding: 0.45em 1em; cursor: pointer; display: flex; align-items: center; gap: 0.45em; box-shadow: 0 0.14em 0 #2A6E14; text-shadow: 0 2px 0 #2A6E14; animation: dsBtnPulse 1.2s ease-in-out 2.5s infinite;">
              <span>Купить</span>
              <span style="display: flex; align-items: center; gap: 0.2em; background: #14261A; border-radius: 0.35em; padding: 0.15em 0.4em; font-size: 0.8em;">
                <span style="display: inline-block; width: 0.8em; height: 0.8em; border: 0.12em solid #fff; transform: rotate(45deg); border-radius: 0.1em; position: relative;"><span style="position: absolute; left: 0.16em; top: 0.16em; width: 0.28em; height: 0.28em; background: #fff;"></span></span>
                <span>{{ price }}</span>
              </span>
            </button>
            <button onClick="{{ onDecline }}" style="font-family: inherit; font-weight: 700; color: #fff; font-size: 3em; line-height: 1; background: linear-gradient(180deg, #4A5578, #323A54); border: 3px solid #14261A; border-radius: 0.5em; padding: 0.5em 1.1em; cursor: pointer; box-shadow: 0 0.14em 0 #1B2035; text-shadow: 0 2px 0 #1B2035;">Нет, в лобби</button>
          </div>
          </sc-if>
        </div>
      </sc-if>

      <!-- REVIVE -->
      <sc-if value="{{ isRevive }}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 1.8em;">
          <div style="position: relative; width: 1em; height: 0.85em; font-size: 13em; animation: dsRevive 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both, dsBeat 1.1s ease-in-out 0.9s 2, dsOutItem 0.5s ease-in 3.1s forwards;">
            <div style="position: absolute; inset: 0; transform: scale(1.16); transform-origin: 50% 55%;">
              <div style="position: absolute; left: 0.25em; top: 0.2em; width: 0.5em; height: 0.5em; background: #14261A; transform: rotate(45deg);"></div>
              <div style="position: absolute; left: 0.073em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #14261A;"></div>
              <div style="position: absolute; left: 0.427em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #14261A;"></div>
            </div>
            <div style="position: absolute; inset: 0;">
              <div style="position: absolute; left: 0.25em; top: 0.2em; width: 0.5em; height: 0.5em; background: #E5484D; transform: rotate(45deg);"></div>
              <div style="position: absolute; left: 0.073em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #E5484D;"></div>
              <div style="position: absolute; left: 0.427em; top: 0.023em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #E5484D;"></div>
              <div style="position: absolute; left: 0.2em; top: 0.14em; width: 0.15em; height: 0.15em; border-radius: 50%; background: rgba(255,255,255,0.6);"></div>
            </div>
            <!-- sparks -->
            <div style="position: absolute; left: 50%; top: 45%; width: 0; height: 0;">
              <sc-for list="{{ sparks }}" as="k" hint-placeholder-count="1">
                <div style="position: absolute; left: 0; top: 0; width: 0; height: 0; transform: rotate({{ k.rot }}deg);">
                  <div style="position: absolute; left: -0.5rem; top: -0.5rem; width: 1rem; height: 1rem; background: {{ k.color }}; border-radius: {{ k.radius }}; font-size: {{ k.fs }}rem; opacity: 0; animation: {{ k.anim }};"></div>
                </div>
              </sc-for>
            </div>
          </div>
          <span style="color: #7AE04D; font-size: 9em; line-height: 1; white-space: nowrap; text-shadow: 0 3px 0 #14261A, 0 6px 0 rgba(0,0,0,0.35); animation: dsDrop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s both, dsOutItem 0.5s ease-in 3.1s forwards;">ВЫ ЖИВЫ!</span>
          <span style="color: #fff; font-size: 3.4em; line-height: 1.2; white-space: nowrap; text-shadow: 0 2px 0 #14261A; animation: dsRise 0.5s ease-out 1.2s both, dsOutItem 0.5s ease-in 3.1s forwards;">Экстра-жизнь активирована. Забег продолжается</span>
        </div>
      </sc-if>

      <!-- LOBBY LOADING -->
      <sc-if value="{{ isLobby }}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; inset: 0; z-index: 5; background: #050607; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2em; animation: dsBg 0.5s ease-out both;">
          <span style="font-family: 'Caveat', cursive; color: #fff; font-size: 7em; line-height: 1; animation: dsRise 0.5s ease-out 0.3s both;">{{ lobbyText }}</span>
          <div style="width: 1em; height: 1em; font-size: 9em; position: relative; animation: dsRise 0.5s ease-out 0.45s both;">
            <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; animation: dsBob 2.4s ease-in-out infinite;">
              <div style="width: 0.75em; height: 0.28em; background: #fff; border-radius: 0.05em 0.05em 0.3em 0.3em; position: relative;">
                <div style="position: absolute; left: 50%; bottom: 100%; width: 0.05em; height: 0.5em; background: #fff; margin-left: -0.025em;"></div>
                <div style="position: absolute; left: 50%; bottom: 100%; width: 0; height: 0; border-left: 0.3em solid #fff; border-top: 0.42em solid transparent; margin-left: 0.03em; margin-bottom: 0.06em;"></div>
              </div>
            </div>
          </div>
          <span style="color: rgba(255,255,255,0.7); font-size: 3em; line-height: 1; animation: dsRise 0.5s ease-out 0.6s both;">Забег завершён</span>
        </div>
      </sc-if>

      <!-- phone control zones -->
      <sc-if value="{{ phone }}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; left: 3%; bottom: 5%; width: 130px; height: 130px; border: 2px dashed rgba(255,255,255,0.45); border-radius: 50%; z-index: 4; pointer-events: none; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.5); font-size: 1.4em; text-align: center;">зона<br>джойстика</div>
        <div style="position: absolute; right: 4%; bottom: 8%; width: 90px; height: 90px; border: 2px dashed rgba(255,255,255,0.45); border-radius: 50%; z-index: 4; pointer-events: none; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.5); font-size: 1.4em; text-align: center;">кнопка<br>прыжка</div>
      </sc-if>
    </div>
  </div>

  <!-- controls -->
  <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 760px;">
    <button onClick="{{ death3 }}" style="font-family: inherit; font-size: 14px; color: #fff; background: linear-gradient(180deg, #E5484D, #B03030); border: 3px solid #14261a; border-radius: 12px; padding: 7px 14px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.4); text-shadow: 0 2px 0 rgba(0,0,0,0.4);">💀 Смерть (3→2)</button>
    <button onClick="{{ death2 }}" style="font-family: inherit; font-size: 14px; color: #fff; background: linear-gradient(180deg, #E5484D, #B03030); border: 3px solid #14261a; border-radius: 12px; padding: 7px 14px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.4); text-shadow: 0 2px 0 rgba(0,0,0,0.4);">💀 Смерть (2→1)</button>
    <button onClick="{{ death1 }}" style="font-family: inherit; font-size: 14px; color: #fff; background: linear-gradient(180deg, #E5484D, #B03030); border: 3px solid #14261a; border-radius: 12px; padding: 7px 14px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.4); text-shadow: 0 2px 0 rgba(0,0,0,0.4);">💀 Последняя (1→0) + Robux</button>
    <button onClick="{{ goRevive }}" style="font-family: inherit; font-size: 14px; color: #fff; background: linear-gradient(180deg, #7ae04d, #48b428); border: 3px solid #14261a; border-radius: 12px; padding: 7px 14px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.4); text-shadow: 0 2px 0 rgba(0,0,0,0.4);">❤️ Оживление</button>
    <button onClick="{{ goLobby }}" style="font-family: inherit; font-size: 14px; color: #fff; background: linear-gradient(180deg, #4a5578, #323a54); border: 3px solid #14261a; border-radius: 12px; padding: 7px 14px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.4); text-shadow: 0 2px 0 rgba(0,0,0,0.4);">⛵ В лобби</button>
    <button onClick="{{ togglePhone }}" style="font-family: inherit; font-size: 14px; color: #fff; background: linear-gradient(180deg, #4a5578, #323a54); border: 3px solid #14261a; border-radius: 12px; padding: 7px 14px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.4); text-shadow: 0 2px 0 rgba(0,0,0,0.4);">{{ phoneLabel }}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 820, &quot;height&quot;: 520},
  &quot;livesBefore&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 3, &quot;min&quot;: 1, &quot;max&quot;: 3, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Механика&quot;},
  &quot;price&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 49, &quot;min&quot;: 1, &quot;max&quot;: 999, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Экстра-жизнь&quot;}
}">
class Component extends DCLogic {
  state = { phase: 'death', phone: false, dots: 1, dead: true, lb: 3 }; // death | revive | lobby | idle; lb = lives before death
  _t = [];
  clear() { this._t.forEach(clearTimeout); clearInterval(this._iv); this._t = []; }
  go(phase, lb) {
    this.clear();
    this.setState({ phase: 'idle', dead: phase !== 'revive', lb: lb ?? this.state.lb });
    this._t.push(setTimeout(() => {
      this.setState({ phase });
      if (phase === 'revive') this._t.push(setTimeout(() => this.setState({ phase: 'idle', dead: false }), 3700));
      if (phase === 'death' && (lb ?? this.state.lb) > 1) this._t.push(setTimeout(() => this.setState({ phase: 'idle', dead: false }), 4000));
      if (phase === 'lobby') this._iv = setInterval(() => this.setState(s => ({ dots: s.dots % 3 + 1 })), 450);
    }, 40));
  }
  componentDidMount() { this._t.push(setTimeout(() => this.go('death', this.props.livesBefore ?? 3), 300)); }
  componentWillUnmount() { this.clear(); }
  renderVals() {
    const { phase, phone, dots, dead, lb } = this.state;
    const la = Math.max(0, lb - 1), offer = la === 0;
    const W = phone ? 812 : 1586, H = phone ? 375 : 820, scale = 760 / W;
    const isDeath = phase === 'death', isRevive = phase === 'revive', isLobby = phase === 'lobby';
    const spring = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
    const autoOut = isDeath && !offer;
    const out = autoOut ? ', dsOutItem 0.5s ease-in 3.4s forwards' : '';
    const lives = [0, 1, 2].map(i => {
      const full = i < la, breaking = i === la, red = full || breaking, d = (0.5 + i * 0.08).toFixed(2);
      return {
        redOpacity: red ? 1 : 0,
        outlineAnim: `dsRise 0.4s ease-out ${d}s both`,
        anim: !red ? 'none' : full
          ? `dsDrop 0.7s ${spring} ${d}s both, dsPulse 1s ease-in-out 1.3s infinite`
          : `dsDrop 0.7s ${spring} ${d}s both, dsBreak 0.6s ease-in 1.1s forwards`,
        crack1: breaking ? 'dsCrack 0.08s linear 1.05s forwards' : 'none',
        crack2: breaking ? 'dsCrack 0.08s linear 1.1s forwards' : 'none',
        crack3: breaking ? 'dsCrack 0.08s linear 1.15s forwards' : 'none'
      };
    });
    const mk = (rots, fss, delay, dur, name, colors) => rots.map((rot, i) => ({ rot, fs: fss[i], radius: i % 2 ? '50%' : '15%', color: colors ? colors[i % colors.length] : '#E5484D', anim: `${name} ${dur}s ease-out ${delay}s forwards` }));
    return {
      W, H, scale, wrapH: Math.round(H * scale), baseFs: +(H / 820 * 10).toFixed(3),
      phone, isDeath, isRevive, isLobby, offer, lives, breakX: (la - 1) * 15.2,
      deathOut: autoOut ? 'dsOutItem 0.5s ease-in 3.4s forwards' : 'none',
      title: offer ? 'ЖИЗНИ КОМАНДЫ КОНЧИЛИСЬ' : `Осталось жизней: ${la}`,
      titleSize: offer ? 7.5 : 8,
      caption: offer ? 'Купить экстра-жизнь за Robux и продолжить забег?' : (la === 1 ? 'Последняя жизнь команды — берегите её' : 'Команда потеряла одну жизнь'),
      dimOn: isDeath || isRevive,
      bgAnim: isRevive ? 'dsBg 0.3s ease-out both, dsOutBg 0.5s ease-in 3.1s forwards' : (autoOut ? 'dsBg 0.45s ease-out both, dsOutBg 0.5s ease-in 3.5s forwards' : 'dsBg 0.45s ease-out both'),
      price: this.props.price ?? 49,
      badgeColor: dead ? '#3A3F4A' : '#E5484D',
      badgeAnim: isDeath ? 'dsBadgeGrey 0.4s ease 0.3s forwards' : 'none',
      tearAnim: isDeath ? 'dsTear 0.5s ease-in 0.15s forwards' : (isRevive ? 'dsRevive 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s both' : (dead ? 'dsTear 0.01s linear forwards' : 'none')),
      crack1: isDeath ? 'dsCrack 0.08s linear 0.05s forwards' : 'none',
      crack2: isDeath ? 'dsCrack 0.08s linear 0.09s forwards' : 'none',
      crack3: isDeath ? 'dsCrack 0.08s linear 0.13s forwards' : 'none',
      hpW: dead ? '0%' : '100%',
      hpText: dead ? '0 / 100' : '100 / 100',
      hpAnim: isRevive ? 'dsFill 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s both' : 'none',
      tearShards: isDeath ? mk([-75, -45, -15, 15, 45, 75], [1.1, 1.5, 1.2, 1.6, 1.1, 1.4], 0.12, 0.6, 'dsShard') : [],
      breakShards: isDeath && lb > 0 ? mk([-80, -55, -30, -8, 12, 34, 58, 82, -65, 45], [1.6, 2.2, 1.8, 2.4, 1.7, 2.1, 1.5, 2.0, 2.6, 2.5], 1.35, 0.7, 'dsShard') : [],
      sparks: isRevive ? mk([-85, -60, -35, -12, 10, 32, 55, 80, -70, 45, -20, 20], [1.8, 2.4, 2.0, 2.6, 1.9, 2.3, 1.7, 2.2, 2.8, 2.7, 1.6, 2.1], 0.45, 0.9, 'dsSpark', ['#7AE04D', '#FFD54A', '#fff']) : [],
      lobbyText: 'Возвращаемся в лобби' + '.'.repeat(dots),
      onBuy: () => this.go('revive'),
      onDecline: () => this.go('lobby'),
      death3: () => this.go('death', 3),
      death2: () => this.go('death', 2),
      death1: () => this.go('death', 1),
      goRevive: () => this.go('revive'),
      goLobby: () => this.go('lobby'),
      togglePhone: () => { this.setState({ phone: !this.state.phone }); setTimeout(() => this.go('death', 1), 0); },
      phoneLabel: phone ? '📱 Телефон 812×375' : '🖥 ПК 1586×820'
    };
  }
}
</script>
</body>
</html>
