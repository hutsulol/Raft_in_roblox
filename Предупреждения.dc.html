<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #16181d; font-family: 'Fredoka', 'Baloo 2', sans-serif; }
  a { color: #7fb4ff; } a:hover { color: #a8ccff; }
  @keyframes radFlash { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
  @keyframes dangerPop { 0% { transform: translateX(-50%) scale(0.6) rotate(-3deg); opacity: 0; } 60% { transform: translateX(-50%) scale(1.08) rotate(1deg); opacity: 1; } 100% { transform: translateX(-50%) scale(1) rotate(-1deg); opacity: 1; } }
  @keyframes dangerShake { 0%, 100% { transform: translateX(-50%) scale(1) rotate(-1deg); } 25% { transform: translateX(-50%) scale(1) rotate(-2.2deg); } 75% { transform: translateX(-50%) scale(1) rotate(0.2deg); } }
  @keyframes sickIcon { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 55% { transform: scale(1.25) rotate(8deg); opacity: 1; } 75% { transform: scale(0.95) rotate(-3deg); } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
  @keyframes sickText { 0%, 35% { transform: scale(3); opacity: 0; } 60% { transform: scale(0.92); opacity: 1; } 75% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes sickPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes sickOutBg { 0% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes sickOutItem { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.55); opacity: 0; } }
  @keyframes warnPulse { 0%, 100% { box-shadow: inset 0 3px 0 rgba(255,255,255,0.25), 0 4px 0 rgba(0,0,0,0.35), 0 0 0 0 rgba(240,69,69,0.65); } 50% { box-shadow: inset 0 3px 0 rgba(255,255,255,0.25), 0 4px 0 rgba(0,0,0,0.35), 0 0 0 12px rgba(240,69,69,0); } }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 30px;">
  <div style="width: 720px; height: 420px; border-radius: 14px; overflow: hidden; position: relative; background: linear-gradient(180deg, #7ec8e8 0%, #3d92c4 30%, #1d6ba0 60%, #14517d 100%);">
    <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.06) 0 6px, transparent 6px 14px, rgba(255,255,255,0.06) 14px 20px, transparent 20px 64px); background-size: 90px 90px;"></div>
    <!-- radiation damage: pulsing green + red vignette -->
    <sc-if value="{{ radOn }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0; pointer-events: none; z-index: 3; background: radial-gradient(ellipse at center, transparent 40%, rgba(122,224,77,0.25) 72%, rgba(74,160,28,0.6) 100%); animation: radFlash 0.9s ease-in-out infinite;"></div>
      <div style="position: absolute; inset: 0; pointer-events: none; z-index: 3; background: radial-gradient(ellipse at center, transparent 52%, rgba(240,69,69,0.55) 100%); animation: radFlash 0.45s ease-in-out infinite;"></div>
      <!-- danger sticker -->
      <div style="position: absolute; top: 30px; left: 50%; z-index: 4; background: linear-gradient(180deg, #f0d24d 0%, #e8a820 100%); border: 4px solid #14261a; border-radius: 16px; padding: 8px 22px 8px 16px; display: flex; align-items: center; gap: 12px; box-shadow: inset 0 3px 0 rgba(255,255,255,0.5), 0 5px 0 rgba(0,0,0,0.35); animation: dangerPop 0.35s ease-out, dangerShake 0.5s ease-in-out 0.35s infinite;">
        <span style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #d0f088 0%, #8ac832 60%, #6aa81e 100%); border: 3px solid #4d7d12; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 3px 0 #3a5e0c;">☢️</span>
        <span style="display: flex; flex-direction: column;">
          <span style="color: #fff; font-weight: 700; font-size: 24px; line-height: 1.1; white-space: nowrap; text-shadow: -2px 0 0 #9e1f1f, 2px 0 0 #9e1f1f, 0 -2px 0 #9e1f1f, 0 2px 0 #9e1f1f, 0 4px 0 rgba(0,0,0,0.35); letter-spacing: 0.5px;">ОПАСНОСТЬ!</span>
          <span style="color: #14261a; font-weight: 700; font-size: 17px; line-height: 1.2; white-space: nowrap;">Вода радиоактивна!</span>
        </span>
      </div>
      <!-- damage number -->
      <div style="position: absolute; top: 130px; left: 50%; transform: translateX(-50%); z-index: 4; color: #ff5a5a; font-weight: 700; font-size: 34px; text-shadow: -3px 0 0 #14261a, 3px 0 0 #14261a, 0 -3px 0 #14261a, 0 3px 0 #14261a, 0 5px 0 rgba(0,0,0,0.4); animation: radFlash 0.9s ease-in-out infinite;">-5 ❤️</div>
    </sc-if>
    <!-- radiation sickness: full-screen icon + text, no panels -->
    <sc-if value="{{ sickOn }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0; z-index: 5; pointer-events: none; background: radial-gradient(ellipse at center, rgba(20,38,26,0.55) 0%, rgba(20,38,26,0.75) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; animation: sickOutBg 0.5s ease-in 3.5s forwards;">
        <div style="font-size: 110px; line-height: 1; filter: drop-shadow(0 6px 0 rgba(0,0,0,0.45)) drop-shadow(0 0 26px rgba(138,200,50,0.8)); animation: sickIcon 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both, sickPulse 1s ease-in-out 0.7s 3, sickOutItem 0.4s ease-in 3.55s forwards;">☢️</div>
        <div style="animation: sickText 1s ease-out both, sickPulse 1s ease-in-out 1s 3, sickOutItem 0.4s ease-in 3.5s forwards; display: flex; flex-direction: column; align-items: center;">
          <span style="color: #b8e858; font-weight: 700; font-size: 52px; line-height: 1.05; letter-spacing: 1px; text-align: center; text-shadow: -4px 0 0 #14261a, 4px 0 0 #14261a, 0 -4px 0 #14261a, 0 4px 0 #14261a, -3px -3px 0 #14261a, 3px -3px 0 #14261a, -3px 3px 0 #14261a, 3px 3px 0 #14261a, 0 7px 0 rgba(0,0,0,0.5), 0 0 30px rgba(138,200,50,0.6);">ВЫ ЗАБОЛЕЛИ</span>
          <span style="color: #fff; font-weight: 700; font-size: 38px; line-height: 1.15; text-align: center; text-shadow: -3px 0 0 #14261a, 3px 0 0 #14261a, 0 -3px 0 #14261a, 0 3px 0 #14261a, 0 5px 0 rgba(0,0,0,0.5);">ЛУЧЕВОЙ БОЛЕЗНЬЮ!</span>
        </div>
      </div>
    </sc-if>
    <!-- hunger / thirst warning: sticker like the radiation one -->
    <sc-if value="{{ needWarn }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; bottom: 24px; left: 50%; z-index: 4; background: linear-gradient(180deg, #f06a6a 0%, #c43434 100%); border: 4px solid #14261a; border-radius: 16px; padding: 8px 22px 8px 16px; display: flex; align-items: center; gap: 12px; box-shadow: inset 0 3px 0 rgba(255,255,255,0.4), 0 5px 0 rgba(0,0,0,0.35); animation: dangerPop 0.35s ease-out, dangerShake 0.5s ease-in-out 0.35s infinite;">
        <span style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: {{ warnBadgeBg }}; border: 3px solid {{ warnBadgeBorder }}; display: flex; align-items: center; justify-content: center; font-size: 22px; line-height: 1; box-shadow: 0 3px 0 {{ warnBadgeShadow }};"><span style="display: block; transform: translate(0.5px, -1px);">{{ warnIcon }}</span></span>
        <span style="display: flex; flex-direction: column;">
          <span style="color: #fff; font-weight: 700; font-size: 24px; line-height: 1.1; white-space: nowrap; text-shadow: -2px 0 0 #701414, 2px 0 0 #701414, 0 -2px 0 #701414, 0 2px 0 #701414, 0 4px 0 rgba(0,0,0,0.35); letter-spacing: 0.5px;">{{ warnTitle }}</span>
          <span style="color: #14261a; font-weight: 700; font-size: 17px; line-height: 1.2; white-space: nowrap;">{{ warnText }}</span>
        </span>
      </div>
    </sc-if>
  </div>
  <!-- demo switches -->
  <div style="display: flex; gap: 10px;">
    <button onClick="{{ toggleRad }}" style="font-family: inherit; font-weight: 700; font-size: 15px; color: #fff; background: {{ radBtnBg }}; border: 3px solid #14261a; border-radius: 12px; padding: 7px 16px; cursor: pointer; box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 4px 0 rgba(0,0,0,0.4); text-shadow: 0 2px 0 rgba(0,0,0,0.4);">☢️ Урон радиацией</button>
    <button onClick="{{ toggleSick }}" style="font-family: inherit; font-weight: 700; font-size: 15px; color: #fff; background: {{ sickBtnBg }}; border: 3px solid #14261a; border-radius: 12px; padding: 7px 16px; cursor: pointer; box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 4px 0 rgba(0,0,0,0.4); text-shadow: 0 2px 0 rgba(0,0,0,0.4);">🤢 Лучевая болезнь</button>
    <button onClick="{{ cycleNeed }}" style="font-family: inherit; font-weight: 700; font-size: 15px; color: #fff; background: {{ needBtnBg }}; border: 3px solid #14261a; border-radius: 12px; padding: 7px 16px; cursor: pointer; box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 4px 0 rgba(0,0,0,0.4); text-shadow: 0 2px 0 rgba(0,0,0,0.4);">{{ needBtnLabel }}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 780, &quot;height&quot;: 540}}">
class Component extends DCLogic {
  state = { rad: true, need: 'голод', sick: false }; // need: 'нет' | 'голод' | 'жажда'
  renderVals() {
    const { rad, need, sick } = this.state;
    return {
      radOn: rad,
      sickOn: sick,
      toggleSick: () => {
        clearTimeout(this._sickT);
        if (this.state.sick) return this.setState({ sick: false });
        this.setState({ sick: true });
        this._sickT = setTimeout(() => this.setState({ sick: false }), 4000);
      },
      sickBtnBg: sick ? 'linear-gradient(180deg, #8ac832, #5a8a1e)' : 'linear-gradient(180deg, #4a5578, #323a54)',
      needWarn: need !== 'нет',
      warnIcon: need === 'жажда' ? '💧' : '🍖',
      warnTitle: need === 'жажда' ? 'ЖАЖДА!' : 'ГОЛОД!',
      warnText: need === 'жажда' ? 'Уровень жажды крайне низок, нужно попить!' : 'Уровень голода крайне низок, нужно поесть!',
      warnBadgeBg: need === 'жажда' ? 'radial-gradient(circle at 35% 28%, #fff 0%, #d8ecff 55%, #a8ccf0 100%)' : 'radial-gradient(circle at 35% 28%, #ffd98a 0%, #f0a828 60%, #d1881a 100%)',
      warnBadgeBorder: need === 'жажда' ? '#1560a8' : '#a86a10',
      warnBadgeShadow: need === 'жажда' ? '#0e477d' : '#7d4e0a',
      toggleRad: () => this.setState(s => ({ rad: !s.rad })),
      cycleNeed: () => this.setState(s => ({ need: s.need === 'нет' ? 'голод' : s.need === 'голод' ? 'жажда' : 'нет' })),
      radBtnBg: rad ? 'linear-gradient(180deg, #8ac832, #5a8a1e)' : 'linear-gradient(180deg, #4a5578, #323a54)',
      needBtnBg: need !== 'нет' ? 'linear-gradient(180deg, #f06a6a, #b03030)' : 'linear-gradient(180deg, #4a5578, #323a54)',
      needBtnLabel: need === 'нет' ? 'Голод/жажда: выкл' : need === 'голод' ? '🍖 Голод: вкл' : '💧 Жажда: вкл'
    };
  }
}
</script>
</body>
</html>
