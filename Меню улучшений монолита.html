  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n<!--\n  ═══ ROBLOX IMPLEMENTATION NOTES (для Claude Code) ═══\n  Меню монолита дайвера. Два состояния одного окна:\n    1. RepairFrame  — монолит сломан: заголовок, блок \"что даёт\" (коробка -> патроны/еда/сокровища),\n       большая кнопка \"Починить\" + строка \"Необходимо: <ресурсы>\". Поверх панели — CanvasGroup\n       с паутиной (углы) и пылью (низ), pointer-events нет.\n    2. UpgradeFrame — монолит работает: 3 строки улучшений (Шанс сокровищ, Кол-во дайверов,\n       Размер коробок), у каждой: иконка, название, пилюля \"Ур. N\", эффект, кнопка \"Улучшить\",\n       пилюля стоимости (зелёная = хватает, красная #d84f40 = не хватает).\n  Переход по кнопке \"Починить\":\n    - заблокировать кнопку;\n    - TweenService: CanvasGroup паутины GroupTransparency 0 -> 1 за 0.65s (Quad, Out);\n    - затем RepairFrame.Visible = false; UpgradeFrame.Visible = true (появление: прозрачность\n      1 -> 0 и сдвиг Y +6px -> 0 за 0.3s).\n  Палитра: панель #3d81c6, обводка #1e4f88, подложки блоков #549ad9 (обводка #3c7ab2),\n  плитки иконок #9cc7eb с обводкой #16324e, зелёный кнопок/пилюль #12b512 (тень #0f7c0c),\n  красная пилюля #d84f40, тёмно-синие элементы #16395c, текст белый / #cfe4f7.\n  Панель 860x470, скругление 22, шрифт Fredoka (Roblox: FredokaOne / GothamBold).\n  Правая колонка — рендер дайвера (ViewportFrame или ImageLabel), 280px во всю высоту.\n  Кнопка закрытия — на правом верхнем углу панели, наполовину за её краем.\n-->\n<div style=\"font-family:'Fredoka',sans-serif; width:960px; min-height:560px; padding:40px; box-sizing:border-box; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#3a7cba 0%,#245a94 100%)\">\n\n  <!-- PANEL -->\n  <div style=\"position:relative; width:860px; height:470px; background:#3d81c6; border:3px solid #1e4f88; border-radius:22px; box-shadow:0 10px 24px rgba(10,40,80,0.35); padding:24px 26px; box-sizing:border-box; display:flex; gap:22px\">\n\n    <!-- stud pattern -->\n    <div style=\"position:absolute; inset:0; background-image:radial-gradient(circle at 12px 12px, rgba(255,255,255,0.07) 6px, transparent 7px); background-size:48px 48px; pointer-events:none; border-radius:18px\"><\u002Fdiv>\n\n    <!-- AGING OVERLAY (repair only): паутина, пыль, трещины -->\n    <sc-if value=\"{{ isRepair }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute; inset:0; pointer-events:none; z-index:6; border-radius:18px; overflow:hidden; opacity:{{ webOpacity }}; transition:opacity 0.65s ease\">\n        <!-- паутина в левом верхнем углу -->\n        <svg style=\"position:absolute; top:-2px; left:-2px\" width=\"150\" height=\"150\" viewBox=\"0 0 150 150\" fill=\"none\" stroke=\"rgba(240,248,255,0.8)\" stroke-width=\"1.5\">\n          <path d=\"M0 0 L150 12\"><\u002Fpath>\n          <path d=\"M0 0 L128 78\"><\u002Fpath>\n          <path d=\"M0 0 L70 132\"><\u002Fpath>\n          <path d=\"M0 0 L14 150\"><\u002Fpath>\n          <path d=\"M44.8 3.6 Q38 16 38.4 23.4 Q31 33 21.1 39.7 Q13 43 4.2 44.8\"><\u002Fpath>\n          <path d=\"M84.7 6.8 Q74 28 72.6 44.2 Q58 62 39.9 75.1 Q25 82 7.9 84.7\"><\u002Fpath>\n          <path d=\"M124.5 10 Q108 40 106.8 65 Q85 92 58.6 110.4 Q37 121 11.6 124.5\"><\u002Fpath>\n        <\u002Fsvg>\n        <!-- паутина в правом нижнем углу -->\n        <svg style=\"position:absolute; bottom:-2px; right:-2px; transform:rotate(180deg)\" width=\"105\" height=\"105\" viewBox=\"0 0 150 150\" fill=\"none\" stroke=\"rgba(240,248,255,0.7)\" stroke-width=\"1.5\">\n          <path d=\"M0 0 L150 12\"><\u002Fpath>\n          <path d=\"M0 0 L128 78\"><\u002Fpath>\n          <path d=\"M0 0 L70 132\"><\u002Fpath>\n          <path d=\"M0 0 L14 150\"><\u002Fpath>\n          <path d=\"M44.8 3.6 Q38 16 38.4 23.4 Q31 33 21.1 39.7 Q13 43 4.2 44.8\"><\u002Fpath>\n          <path d=\"M84.7 6.8 Q74 28 72.6 44.2 Q58 62 39.9 75.1 Q25 82 7.9 84.7\"><\u002Fpath>\n          <path d=\"M124.5 10 Q108 40 106.8 65 Q85 92 58.6 110.4 Q37 121 11.6 124.5\"><\u002Fpath>\n        <\u002Fsvg>\n        <!-- пыль и трещины -->\n        <svg style=\"position:absolute; inset:0; width:100%; height:100%\" viewBox=\"0 0 860 470\" preserveAspectRatio=\"none\">\n          <g fill=\"rgba(70,85,100,0.22)\">\n            <circle cx=\"210\" cy=\"440\" r=\"4\"><\u002Fcircle>\n            <circle cx=\"238\" cy=\"448\" r=\"2.5\"><\u002Fcircle>\n            <circle cx=\"256\" cy=\"442\" r=\"3\"><\u002Fcircle>\n            <circle cx=\"640\" cy=\"52\" r=\"2.5\"><\u002Fcircle>\n            <circle cx=\"662\" cy=\"44\" r=\"3.5\"><\u002Fcircle>\n            <circle cx=\"120\" cy=\"180\" r=\"2.5\"><\u002Fcircle>\n            <circle cx=\"470\" cy=\"120\" r=\"2.5\"><\u002Fcircle>\n            <circle cx=\"500\" cy=\"300\" r=\"3\"><\u002Fcircle>\n          <\u002Fg>\n          <g fill=\"rgba(70,85,100,0.14)\">\n            <ellipse cx=\"230\" cy=\"452\" rx=\"42\" ry=\"7\"><\u002Fellipse>\n            <ellipse cx=\"600\" cy=\"455\" rx=\"30\" ry=\"6\"><\u002Fellipse>\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- LEFT -->\n    <div style=\"position:relative; flex:1; display:flex; flex-direction:column; gap:16px; min-width:0\">\n\n      <!-- ===== REPAIR SCREEN ===== -->\n      <sc-if value=\"{{ isRepair }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:16px; height:100%\">\n          <div>\n            <div style=\"font-size:30px; font-weight:700; color:#ffffff; text-shadow:0 2px 3px rgba(20,60,110,0.4); line-height:1.1\">Почини монолит дайвера<\u002Fdiv>\n            <div style=\"margin-top:5px; font-size:17px; font-weight:500; color:#cfe4f7\">Дайвер оживёт и будет приносить коробки с моря<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"flex:1; background:{{ blockBg }}; border:2px solid {{ blockBorder }}; border-radius:16px; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:14px\">\n            <div style=\"display:flex; flex-direction:column; align-items:center; gap:5px\">\n              <div style=\"width:84px; height:84px; background:#9cc7eb; border:2px solid #16324e; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:44px\">📦<\u002Fdiv>\n              <div style=\"font-size:14px; font-weight:600; color:#ffffff\">Коробки<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:26px; font-weight:700; color:#ffffff; text-shadow:0 2px 3px rgba(20,60,110,0.4); padding-bottom:20px\">→<\u002Fdiv>\n            <sc-for list=\"{{ rewards }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; flex-direction:column; align-items:center; gap:5px\">\n                <div style=\"width:84px; height:84px; background:#9cc7eb; border:2px solid #16324e; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:42px\">{{ r.icon }}<\u002Fdiv>\n                <div style=\"font-size:15px; font-weight:600; color:#ffffff\">{{ r.name }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:auto\">\n            <button onclick=\"{{ onRepair }}\" style=\"width:100%; padding:17px 0; background:{{ btnBg }}; border:none; border-radius:28px; font-family:'Fredoka',sans-serif; font-size:24px; font-weight:700; color:#ffffff; text-shadow:0 1px 2px rgba(0,0,0,0.25); cursor:pointer; box-shadow:0 4px 0 {{ btnShadow }}\" style-hover=\"filter:brightness(1.06)\" style-active=\"transform:translateY(3px); box-shadow:none\">Починить<\u002Fbutton>\n            <div style=\"display:flex; align-items:center; gap:8px\">\n              <div style=\"font-size:16px; font-weight:600; color:#cfe4f7\">Необходимо:<\u002Fdiv>\n              <sc-for list=\"{{ costs }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <div style=\"padding:6px 14px; background:{{ c.bg }}; border-radius:14px; font-size:15px; font-weight:600; color:#ffffff; text-shadow:0 1px 2px rgba(0,0,0,0.25); display:flex; align-items:center; gap:6px; white-space:nowrap\"><span>{{ c.icon }}<\u002Fspan><span>{{ c.need }} {{ c.name }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== UPGRADE SCREEN ===== -->\n      <sc-if value=\"{{ isUpgrade }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex; flex-direction:column; justify-content:space-between; gap:14px; height:100%; opacity:{{ upgradeOpacity }}; transform:translateY({{ upgradeShift }}); transition:opacity 0.3s ease, transform 0.3s ease\">\n          <div>\n            <div style=\"font-size:30px; font-weight:700; color:#ffffff; text-shadow:0 2px 3px rgba(20,60,110,0.4); line-height:1.1\">Монолит дайвера<\u002Fdiv>\n            <div style=\"margin-top:5px; font-size:17px; font-weight:500; color:#cfe4f7\">Работает! Улучшай его, чтобы получать больше добычи<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ upgrades }}\" as=\"u\" hint-placeholder-count=\"3\">\n            <div style=\"background:{{ blockBg }}; border:2px solid {{ blockBorder }}; border-radius:14px; padding:11px 14px; display:flex; align-items:center; gap:14px\">\n              <div style=\"width:60px; height:60px; background:#9cc7eb; border:2px solid #16324e; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:32px; flex-shrink:0\">{{ u.icon }}<\u002Fdiv>\n              <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:5px\">\n                <div style=\"font-size:18px; font-weight:700; color:#ffffff; text-shadow:0 1px 2px rgba(20,60,110,0.4)\">{{ u.name }}<\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:8px\">\n                  <div style=\"padding:3px 10px; background:#16395c; border-radius:10px; font-size:13px; font-weight:600; color:#ffffff; white-space:nowrap; flex-shrink:0\">Ур. {{ u.lvl }}<\u002Fdiv>\n                  <div style=\"font-size:14px; font-weight:600; color:#cfe4f7\">{{ u.effect }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0\">\n                <button onclick=\"{{ onUpgrade }}\" style=\"padding:8px 26px; background:#12b512; border:none; border-radius:18px; font-family:'Fredoka',sans-serif; font-size:16px; font-weight:700; color:#ffffff; text-shadow:0 1px 2px rgba(0,0,0,0.25); cursor:pointer; box-shadow:0 3px 0 #0f7c0c\" style-hover=\"filter:brightness(1.07)\" style-active=\"transform:translateY(2px); box-shadow:none\">Улучшить<\u002Fbutton>\n                <div style=\"padding:3px 10px; background:{{ u.costBg }}; border-radius:10px; font-size:13px; font-weight:600; color:#ffffff; text-shadow:0 1px 2px rgba(0,0,0,0.25); display:flex; align-items:center; gap:4px; white-space:nowrap\"><span>{{ u.costIcon }}<\u002Fspan><span>{{ u.cost }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- RIGHT: diver render -->\n    <div style=\"width:280px; flex-shrink:0; align-self:stretch; min-height:340px\">\n      <x-import component-from-global-scope=\"image-slot\" id=\"diver-render\" placeholder=\"Рендер дайвера (скрин из игры)\" shape=\"rounded\" radius=\"14\" fit=\"cover\" hint-size=\"280px,340px\"><\u002Fx-import>\n    <\u002Fdiv>\n\n    <!-- CLOSE -->\n    <div style=\"position:absolute; top:-14px; right:-14px; width:38px; height:38px; background:#16395c; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; color:#ffffff; cursor:pointer; box-shadow:0 2px 0 rgba(10,30,60,0.3)\" style-hover=\"background:#1f4e79\">✕<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:560},&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;upgrade&quot;,&quot;options&quot;:[&quot;repair&quot;,&quot;upgrade&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Экран&quot;},&quot;canRepair&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Экран&quot;},&quot;blockBg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#549ad9&quot;,&quot;options&quot;:[&quot;#245a94&quot;,&quot;#2e6db4&quot;,&quot;#458cce&quot;,&quot;#549ad9&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Цвета&quot;}}\">\nclass Component extends DCLogic {\n  // Переход \"починка\": по кнопке Починить паутина/пыль плавно исчезают (0.65s),\n  // затем экран repair сменяется экраном upgrade (плавное появление 0.3s).\n  // Roblox: RepairButton.Activated -> TweenService на CanvasGroup с паутиной\n  // (GroupTransparency 0 -> 1, 0.65s, Quad/Out), по завершении:\n  // RepairFrame.Visible = false, UpgradeFrame.Visible = true.\n  state = { repaired: false, websFading: false, upgradeIn: true };\n\n  componentDidUpdate(prevProps) {\n    // сброс, если экран переключили твиком\n    if (prevProps.screen !== this.props.screen && this.state.repaired) {\n      this.setState({ repaired: false, websFading: false });\n    }\n  }\n\n  renderVals() {\n    const tweakScreen = this.props.screen ?? 'upgrade';\n    const screen = this.state.repaired ? 'upgrade' : tweakScreen;\n    const canRepair = this.props.canRepair ?? true;\n    const pillGreen = '#12b512';\n    const pillRed = '#d84f40';\n    const blockBg = this.props.blockBg ?? '#549ad9';\n    // подбираем обводку под светлоту подложки\n    const borders = { '#245a94': '#1a4472', '#2e6db4': '#1e4f88', '#458cce': '#2e6db4', '#549ad9': '#3c7ab2' };\n    return {\n      blockBg,\n      blockBorder: borders[blockBg] || '#3c7ab2',\n      isRepair: screen === 'repair',\n      isUpgrade: screen === 'upgrade',\n      rewards: [\n        { icon: '🔫', name: 'Патроны' },\n        { icon: '🍖', name: 'Еда' },\n        { icon: '💎', name: 'Сокровища' },\n      ],\n      costs: [\n        { icon: '🪵', name: 'Дерево', need: 5, bg: pillGreen },\n        { icon: '🍃', name: 'Листва', need: 5, bg: canRepair ? pillGreen : pillRed },\n      ],\n      upgrades: [\n        { icon: '💎', name: 'Шанс сокровищ', lvl: 2, effect: '10% → 15%', costIcon: '🪵', cost: '20 Дерево', costBg: pillGreen },\n        { icon: '🤿', name: 'Кол-во дайверов', lvl: 1, effect: '1 → 2', costIcon: '🪵', cost: '40 Дерево', costBg: pillGreen },\n        { icon: '📦', name: 'Размер коробок', lvl: 1, effect: '+25% ресурсов из коробки', costIcon: '🍃', cost: '25 Листва', costBg: pillRed },\n      ],\n      btnBg: canRepair ? '#12b512' : '#8a97a4',\n      btnShadow: canRepair ? '#0f7c0c' : '#6b7584',\n      webOpacity: this.state.websFading ? 0 : 1,\n      upgradeOpacity: this.state.upgradeIn ? 1 : 0,\n      upgradeShift: this.state.upgradeIn ? '0px' : '6px',\n      onRepair: () => {\n        if (!canRepair || this.state.websFading || this.state.repaired) return;\n        this.setState({ websFading: true });\n        setTimeout(() => {\n          this.setState({ repaired: true, upgradeIn: false });\n          setTimeout(() => this.setState({ upgradeIn: true }), 40);\n        }, 650);\n      },\n      onUpgrade: () => {},\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
