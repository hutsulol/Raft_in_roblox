<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  @keyframes selPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.0); } 50% { box-shadow: 0 0 0 3px rgba(255,255,255,0.22); } }
  @keyframes starWiggle { 0%,100% { transform: rotate(-10deg) scale(1); } 50% { transform: rotate(4deg) scale(1.12); } }
  @keyframes rareGlow { 0%,100% { box-shadow: 0 0 0 2px #7a3fb0, 0 0 5px rgba(200,143,232,0.35); } 50% { box-shadow: 0 0 0 2px #9a5fd0, 0 0 16px rgba(200,143,232,0.9); } }
  .quest-scroll::-webkit-scrollbar { width: 16px; }
  .quest-scroll::-webkit-scrollbar-track { background: #0a1826; border-left: 3px solid #000; }
  .quest-scroll::-webkit-scrollbar-thumb { background: #2a7fd4; border: 3px solid #000; }
  .quest-scroll::-webkit-scrollbar-thumb:hover { background: #4a9fe8; }
</style>
</helmet>

<div data-screen-label="Quest Menu" style="min-height: 100vh; min-width: fit-content; display: flex; align-items: center; justify-content: center; background: #232323; padding: 32px 20px; font-family: 'M PLUS Rounded 1c', sans-serif; box-sizing: border-box;">

  <div style="position: relative; width: 100%; max-width: 720px; display: flex; flex-direction: column; background: #0e1f30; border: 4px solid #000;">

    <!-- close button -->
    <button onClick="{{ onClose }}" style="position: absolute; top: -4px; right: -4px; z-index: 5; width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; background: #e2571f; border: 4px solid #000; color: #ffffff; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 900; font-size: 26px; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,0.5); cursor: pointer;" style-hover="background: #f06a30;">✕</button>

    <!-- header -->
    <div style="display: flex; align-items: center; gap: 14px; padding: 15px 80px 15px 20px; background-color: #1a3a58; background-image: radial-gradient(rgba(255,255,255,0.06) 22%, transparent 24%); background-size: 30px 30px;">
      <div style="width: 54px; height: 54px; flex: none; display: flex; align-items: center; justify-content: center; background: #ffd23a; border: 3px solid #000; box-shadow: 0 3px 0 rgba(0,0,0,0.4); font-weight: 900; font-size: 30px; color: #3d2a05;">!</div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-weight: 900; font-size: 32px; line-height: 1.15; letter-spacing: 1px; color: #ffffff; text-shadow: 0 3px 0 #000, 2px 0 0 #000, -2px 0 0 #000, 0 -2px 0 #000;">Квесты</div>
        <div style="font-weight: 800; font-size: 14px; color: #7fa8c9;">Выполняй задания и получай награды</div>
      </div>
      <div style="flex: none; padding: 6px 14px; background: #0a1826; border: 2px solid #000; font-weight: 900; font-size: 14px; color: #ffd23a; text-shadow: 0 1px 0 #000;">Активных: {{ activeCount }}</div>
    </div>

    <!-- gold band -->
    <div style="height: 6px; background: linear-gradient(90deg, #ffd76f, #ffd23a 40%, #c9962a); border-top: 3px solid #000; border-bottom: 3px solid #000;"></div>

    <!-- quest list (скроллится, справа скроллбар) -->
    <div class="quest-scroll" style="display: flex; flex-direction: column; gap: 18px; padding: 20px 14px 16px 18px; max-height: 396px; overflow-y: scroll;">
      <sc-for list="{{ quests }}" as="q" hint-placeholder-count="3">
        <div style="position: relative; display: flex; align-items: stretch; background: #12293d; border: 3px solid {{ q.border }}; animation: {{ q.anim }};">

          <!-- tracked star -->
          <sc-if value="{{ q.tracked }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; top: -16px; right: -12px; z-index: 3; font-size: 32px; color: #ffd23a; text-shadow: 0 2px 0 #000, 2px 0 0 #000, -2px 0 0 #000, 0 -2px 0 #000; animation: starWiggle 1.4s ease-in-out infinite;">★</div>
          </sc-if>

          <!-- круглая аватарка персонажа + имя под ней (в Roblox — ImageLabel с портретом NPC + UICorner в круг) -->
          <div style="flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 0 12px 16px;">
            <div style="width: 66px; height: 66px; border-radius: 50%; background: linear-gradient(180deg, {{ q.accentDim }} 0%, #0a1826 100%); border: 3px solid #000; box-shadow: 0 0 0 3px {{ q.accent }}, 0 4px 0 rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;">
              <div style="font-size: 34px; line-height: 1; color: {{ q.accentBright }}; text-shadow: 0 3px 0 rgba(0,0,0,0.5);">{{ q.avatar }}</div>
            </div>
            <div style="margin-top: -11px; position: relative; z-index: 2; padding: 2px 9px; background: {{ q.accent }}; border: 2px solid #000; font-weight: 900; font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; text-align: center; white-space: nowrap; color: #ffffff; text-shadow: 0 1px 0 #000;">{{ q.charName }}</div>
          </div>

          <!-- content -->
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 14px 14px 12px 16px;">
            <div style="font-weight: 900; font-size: 20px; line-height: 1.2; color: #ffffff; text-shadow: 0 2px 0 #000, 1px 0 0 #000, -1px 0 0 #000;">{{ q.title }}</div>
            <div style="font-weight: 800; font-size: 13.5px; color: #7fa8c9;">{{ q.desc }}</div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
              <div style="font-weight: 900; font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: #5a7a96; flex: none;">Награда</div>
              <sc-for list="{{ q.rewards }}" as="r" hint-placeholder-count="2">
                <div style="position: relative; width: 46px; height: 46px; flex: none; display: flex; align-items: center; justify-content: center; background: {{ r.slotBg }}; border: 2px solid #000; animation: {{ r.slotAnim }};">
                  <div style="font-size: 21px; color: {{ r.color }}; text-shadow: 0 2px 0 rgba(0,0,0,0.7);">{{ r.icon }}</div>
                  <div style="position: absolute; bottom: -7px; right: -7px; padding: 1px 5px; background: #ffd23a; border: 2px solid #000; font-weight: 900; font-size: 10.5px; line-height: 1.2; color: #3d2a05;">{{ r.count }}</div>
                  <sc-if value="{{ r.rare }}" hint-placeholder-val="{{ false }}">
                    <div style="position: absolute; top: -9px; left: -8px; font-size: 15px; line-height: 1; color: #c88fe8; text-shadow: 0 1.5px 0 #000, 1px 0 0 #000, -1px 0 0 #000;">★</div>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </div>

          <!-- track button column -->
          <div style="flex: none; display: flex; align-items: center; padding: 0 14px;">
            <button onClick="{{ q.onTrack }}" style="min-width: 165px; padding: 11px 16px; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 900; font-size: 15px; letter-spacing: 0.5px; color: {{ q.trackColor }}; text-shadow: 0 1.5px 0 #000; background: {{ q.trackBg }}; border: 3px solid {{ q.trackBorder }}; box-shadow: 0 4px 0 rgba(0,0,0,0.45); cursor: pointer;" style-hover="filter: brightness(1.12);">{{ q.trackLabel }}</button>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="text-align: center; font-weight: 800; font-size: 12.5px; color: #5a7a96; padding: 9px 18px 11px 18px; border-top: 3px solid #000; background: #0a1826;">Отслеживаемый квест отображается на экране</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 900, &quot;height&quot;: 620 },
  &quot;trackedQuest&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 0, &quot;min&quot;: -1, &quot;max&quot;: 2, &quot;step&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Состояние&quot; }
}">
class Component extends DCLogic {
  state = { tracked: null };

  renderVals() {
    const tracked = this.state.tracked ?? (this.props.trackedQuest ?? 0);

    const questData = [
      {
        avatar: '\u263B\uFE0E',
        charName: 'Плотник Джек',
        accent: '#2a7fd4', accentDim: '#1d4266', accentBright: '#7fc0ff',
        title: 'Постройте 5 полов',
        desc: 'Разместите 5 полов на своём плоту',
        rewards: [
          { icon: '🪵︎', count: 'x5', color: '#e8b06a' },
          { icon: '▦', count: 'x2', color: '#d9e6f2' },
        ],
      },
      {
        avatar: '\u263B\uFE0E',
        charName: 'Торговец Сэм',
        accent: '#2f9b3a', accentDim: '#1d4a26', accentBright: '#7fe07a',
        title: 'Соберите 12 листвы',
        desc: 'Соберите пучки листвы с пальм',
        rewards: [
          { icon: '⚙︎', count: 'x300', color: '#ffd23a' },
        ],
      },
      {
        avatar: '\u263B\uFE0E',
        charName: 'Капитан Морган',
        accent: '#c93a3a', accentDim: '#4a1d1d', accentBright: '#f07a6a',
        title: 'Победите 3 зомби',
        desc: 'Зачистите пиратский лагерь',
        rewards: [
          { icon: '⚔︎', count: 'x1', color: '#c88fe8', rare: true },
          { icon: '▣', count: 'x1', color: '#c98a4a' },
          { icon: '⚙︎', count: 'x200', color: '#ffd23a' },
        ],
      },
    ];

    const quests = questData.map((q, i) => {
      const isTracked = i === tracked;
      return {
        ...q,
        rewards: q.rewards.map(r => ({
          ...r,
          rare: !!r.rare,
          slotBg: r.rare ? '#2a1d3d' : '#0a1826',
          slotAnim: r.rare ? 'rareGlow 1.6s ease-in-out infinite' : 'none',
        })),
        tracked: isTracked,
        border: isTracked ? '#ffffff' : '#000000',
        anim: isTracked ? 'selPulse 1.6s ease-in-out infinite' : 'none',
        trackLabel: isTracked ? '✓ Отслеживается' : 'Отслеживать',
        trackBg: isTracked ? '#0a1826' : '#35b435',
        trackColor: isTracked ? '#35d435' : '#ffffff',
        trackBorder: isTracked ? '#35b435' : '#000000',
        onTrack: () => this.setState({ tracked: isTracked ? -1 : i }),
      };
    });

    return {
      quests,
      activeCount: questData.length,
      onClose: () => {},
    };
  }
}
</script>
</body>
</html>
