<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
</style>
</helmet>

<div data-screen-label="Settings Menu" style="min-height: 100vh; min-width: fit-content; display: flex; align-items: center; justify-content: center; background: #232323; padding: 32px 20px; font-family: 'M PLUS Rounded 1c', sans-serif; box-sizing: border-box;">

  <div style="position: relative; width: 100%; max-width: 620px; display: flex; flex-direction: column; background: #0e1f30; border: 4px solid #000;">

    <!-- close button -->
    <button onClick="{{ onClose }}" style="position: absolute; top: -4px; right: -4px; z-index: 5; width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; background: #e2571f; border: 4px solid #000; color: #ffffff; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 900; font-size: 26px; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,0.5); cursor: pointer;" style-hover="background: #f06a30;">✕</button>

    <!-- header -->
    <div style="display: flex; align-items: center; gap: 14px; padding: 15px 80px 15px 20px; background-color: #1a3a58; background-image: radial-gradient(rgba(255,255,255,0.06) 22%, transparent 24%); background-size: 30px 30px; border-bottom: 4px solid #000;">
      <div style="width: 54px; height: 54px; flex: none; display: flex; align-items: center; justify-content: center; background: #2a7fd4; border: 3px solid #000; box-shadow: 0 3px 0 rgba(0,0,0,0.4); font-weight: 900; font-size: 28px; color: #ffffff; text-shadow: 0 2px 0 #000;">⚙︎</div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-weight: 900; font-size: 32px; line-height: 1.15; letter-spacing: 1px; color: #ffffff; text-shadow: 0 3px 0 #000, 2px 0 0 #000, -2px 0 0 #000, 0 -2px 0 #000;">Настройки</div>
        <div style="font-weight: 800; font-size: 14px; color: #7fa8c9;">Звук, баланс и выдача ресурсов</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 18px;">

      <!-- ocean volume -->
      <div style="padding: 14px 16px; background: #12293d; border: 3px solid #000;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: #0a1826; border: 2px solid #000; font-size: 22px; color: #4ac9e2; text-shadow: 0 2px 0 rgba(0,0,0,0.7);">≈</div>
          <div style="flex: 1; font-weight: 900; font-size: 18px; color: #ffffff; text-shadow: 0 2px 0 #000, 1px 0 0 #000, -1px 0 0 #000;">Громкость океана</div>
          <div style="flex: none; min-width: 64px; text-align: center; padding: 5px 10px; background: #0a1826; border: 2px solid #000; font-weight: 900; font-size: 16px; color: #ffd23a; text-shadow: 0 1px 0 #000;">{{ volumeLabel }}</div>
        </div>
        <!-- slider -->
        <div ref="{{ sliderRef }}" onMouseDown="{{ onSliderDown }}" style="position: relative; height: 26px; margin-top: 12px; cursor: pointer;">
          <div style="position: absolute; top: 6px; left: 0; right: 0; height: 14px; background: #0a1826; border: 2px solid #000; box-sizing: border-box;">
            <div style="position: absolute; top: 0; left: 0; bottom: 0; width: {{ volumePct }}; background: linear-gradient(180deg, #6fd4e8 0%, #2a9fc4 50%, #17708f 100%);"></div>
          </div>
          <div style="position: absolute; top: 0; left: {{ volumePct }}; transform: translateX(-50%); width: 22px; height: 26px; background: #4a90dc; border: 3px solid #000; box-sizing: border-box; box-shadow: 0 3px 0 rgba(0,0,0,0.45);"></div>
        </div>
      </div>

      <!-- balance -->
      <div style="padding: 14px 16px; background: #12293d; border: 3px solid #000;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: #0a1826; border: 2px solid #000; font-size: 22px; color: #ffd23a; text-shadow: 0 2px 0 rgba(0,0,0,0.7);">⚙︎</div>
          <div style="flex: 1; font-weight: 900; font-size: 18px; color: #ffffff; text-shadow: 0 2px 0 #000, 1px 0 0 #000, -1px 0 0 #000;">Баланс</div>
          <button onClick="{{ onBalMinus }}" style="width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: #c93a3a; border: 3px solid #000; box-shadow: 0 3px 0 rgba(0,0,0,0.45); color: #ffffff; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 900; font-size: 20px; line-height: 1; text-shadow: 0 1.5px 0 #000; cursor: pointer;" style-hover="filter: brightness(1.12);">−</button>
          <input value="{{ balanceStr }}" onChange="{{ onBalInput }}" style="width: 110px; height: 40px; box-sizing: border-box; text-align: center; background: #0a1826; border: 3px solid #000; color: #ffd23a; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 900; font-size: 18px; outline: none;"></input>
          <button onClick="{{ onBalPlus }}" style="width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: #35b435; border: 3px solid #000; box-shadow: 0 3px 0 rgba(0,0,0,0.45); color: #ffffff; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 900; font-size: 20px; line-height: 1; text-shadow: 0 1.5px 0 #000; cursor: pointer;" style-hover="filter: brightness(1.12);">+</button>
        </div>
      </div>

      <!-- resource grant -->
      <div style="padding: 14px 16px; background: #12293d; border: 3px solid #000;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: #0a1826; border: 2px solid #000; font-size: 22px; color: #e8b06a; text-shadow: 0 2px 0 rgba(0,0,0,0.7);">▣</div>
          <div style="flex: 1; font-weight: 900; font-size: 18px; color: #ffffff; text-shadow: 0 2px 0 #000, 1px 0 0 #000, -1px 0 0 #000;">Выдать ресурс</div>
        </div>

        <div style="display: flex; align-items: stretch; gap: 10px; margin-top: 12px;">
          <!-- dropdown -->
          <div style="position: relative; flex: 1;">
            <button onClick="{{ onToggleDrop }}" style="width: 100%; height: 46px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #0a1826; border: 3px solid #000; cursor: pointer; font-family: 'M PLUS Rounded 1c', sans-serif;" style-hover="background: #102438;">
              <div style="font-size: 20px; color: {{ selColor }};">{{ selIcon }}</div>
              <div style="flex: 1; text-align: left; font-weight: 900; font-size: 16px; color: #ffffff; text-shadow: 0 1px 0 #000;">{{ selName }}</div>
              <div style="font-weight: 900; font-size: 14px; color: #7fa8c9;">{{ dropArrow }}</div>
            </button>
            <sc-if value="{{ dropOpen }}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 10; background: #0a1826; border: 3px solid #000; box-shadow: 0 6px 0 rgba(0,0,0,0.45);">
                <sc-for list="{{ resources }}" as="r" hint-placeholder-count="4">
                  <button onClick="{{ r.onPick }}" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: {{ r.bg }}; border: none; border-bottom: 2px solid #000; cursor: pointer; font-family: 'M PLUS Rounded 1c', sans-serif;" style-hover="background: #1d4266;">
                    <div style="font-size: 19px; color: {{ r.color }};">{{ r.icon }}</div>
                    <div style="flex: 1; text-align: left; font-weight: 900; font-size: 15px; color: #ffffff; text-shadow: 0 1px 0 #000;">{{ r.name }}</div>
                  </button>
                </sc-for>
              </div>
            </sc-if>
          </div>
          <!-- amount input -->
          <input value="{{ amountStr }}" onChange="{{ onAmountInput }}" style="width: 90px; height: 46px; box-sizing: border-box; text-align: center; background: #0a1826; border: 3px solid #000; color: #ffd23a; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 900; font-size: 18px; outline: none;"></input>
          <!-- grant button -->
          <button onClick="{{ onGrant }}" style="height: 46px; padding: 0 22px; flex: none; background: #35b435; border: 3px solid #000; box-shadow: 0 4px 0 rgba(0,0,0,0.45); color: #ffffff; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 900; font-size: 16px; text-shadow: 0 1.5px 0 #000; cursor: pointer;" style-hover="filter: brightness(1.12);">Получить</button>
        </div>

        <sc-if value="{{ grantToast }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top: 10px; padding: 7px 12px; background: #0a1826; border: 2px solid #35b435; font-weight: 900; font-size: 14px; color: #35d435; text-shadow: 0 1px 0 #000; text-align: center;">{{ grantToastText }}</div>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 800, &quot;height&quot;: 620 },
  &quot;oceanVolume&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 60, &quot;min&quot;: 0, &quot;max&quot;: 100, &quot;step&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Состояние&quot; },
  &quot;balance&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 23720, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Состояние&quot; }
}">
class Component extends DCLogic {
  state = { volume: null, balance: null, selected: 0, dropOpen: false, amount: '10', grantToast: '' };

  componentDidMount() {
    this._sliderEl = null;
    this._onMove = (e) => {
      if (!this._dragging || !this._sliderEl) return;
      const rect = this._sliderEl.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      this.setState({ volume: Math.round(pct * 100) });
    };
    this._onUp = () => { this._dragging = false; };
    window.addEventListener('mousemove', this._onMove);
    window.addEventListener('mouseup', this._onUp);
  }
  componentWillUnmount() {
    window.removeEventListener('mousemove', this._onMove);
    window.removeEventListener('mouseup', this._onUp);
  }

  renderVals() {
    const volume = this.state.volume ?? (this.props.oceanVolume ?? 60);
    const balance = this.state.balance ?? (this.props.balance ?? 23720);

    const resourceData = [
      { icon: '🪵︎', name: 'Дерево', color: '#e8b06a' },
      { icon: '▦', name: 'Железо', color: '#d9e6f2' },
      { icon: '☘︎', name: 'Листва', color: '#7fe07a' },
      { icon: '⚙︎', name: 'Монеты', color: '#ffd23a' },
    ];
    const sel = resourceData[this.state.selected];

    const resources = resourceData.map((r, i) => ({
      ...r,
      bg: i === this.state.selected ? '#12293d' : '#0a1826',
      onPick: () => this.setState({ selected: i, dropOpen: false }),
    }));

    return {
      volumeLabel: volume + '%',
      volumePct: volume + '%',
      sliderRef: (el) => { this._sliderEl = el; },
      onSliderDown: (e) => {
        this._dragging = true;
        const rect = this._sliderEl.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        this.setState({ volume: Math.round(pct * 100) });
      },

      balanceStr: String(balance),
      onBalInput: (e) => {
        const v = parseInt(e.target.value.replace(/[^0-9]/g, ''), 10);
        this.setState({ balance: isNaN(v) ? 0 : v });
      },
      onBalMinus: () => this.setState({ balance: Math.max(0, balance - 100) }),
      onBalPlus: () => this.setState({ balance: balance + 100 }),

      selIcon: sel.icon, selName: sel.name, selColor: sel.color,
      dropOpen: this.state.dropOpen,
      dropArrow: this.state.dropOpen ? '▲' : '▼',
      onToggleDrop: () => this.setState(s => ({ dropOpen: !s.dropOpen })),
      resources,

      amountStr: this.state.amount,
      onAmountInput: (e) => this.setState({ amount: e.target.value.replace(/[^0-9]/g, '') }),
      onGrant: () => {
        const n = parseInt(this.state.amount, 10) || 0;
        if (n <= 0) return;
        this.setState({ grantToast: Date.now(), grantToastText: '' });
        this.setState({ grantToastText: 'Выдано: ' + sel.name + ' x' + n });
      },
      grantToast: !!this.state.grantToastText,
      grantToastText: this.state.grantToastText || '',

      onClose: () => {},
    };
  }
}
</script>
</body>
</html>
