<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #16181d; font-family: 'Fredoka', 'Baloo 2', sans-serif; }
  a { color: #7fb4ff; } a:hover { color: #a8ccff; }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px;">
  <div style="width: 520px; height: 400px; border-radius: 14px; overflow: hidden; position: relative; background: linear-gradient(180deg, #6ec0e8 0%, #3d92c4 45%, #226ba0 100%);">
    <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.06) 0 6px, transparent 6px 14px, rgba(255,255,255,0.06) 14px 20px, transparent 20px 64px); background-size: 90px 90px;"></div>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
      <!-- stage sticker -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="color: #ffe14d; font-weight: 700; font-size: 30px; text-shadow: -3px 0 0 #14261a, 3px 0 0 #14261a, 0 -3px 0 #14261a, 0 3px 0 #14261a, -2px -2px 0 #14261a, 2px -2px 0 #14261a, -2px 2px 0 #14261a, 2px 2px 0 #14261a, 0 5px 0 rgba(0,0,0,0.4);">{{ stageText }}</span>
      </div>
      <!-- dial -->
      <div onClick="{{ tryPick }}" style="position: relative; width: 250px; height: 250px; cursor: pointer;">
        <svg viewBox="0 0 200 200" style="position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 6px 0 rgba(0,0,0,0.3));">
          <circle cx="100" cy="100" r="92" fill="{{ faceColor }}" stroke="#14261a" stroke-width="7"></circle>
          <g transform="rotate(-90 100 100)">
            <circle cx="100" cy="100" r="78" fill="none" stroke="#39466b" stroke-width="16"></circle>
            <circle cx="100" cy="100" r="78" fill="none" stroke="{{ zoneColor }}" stroke-width="16" stroke-dasharray="{{ zoneDash }}" stroke-dashoffset="{{ zoneOffset }}"></circle>
            <circle cx="100" cy="100" r="78" fill="none" stroke="#14261a" stroke-width="18" stroke-dasharray="2.5 9.75"></circle>
          </g>
          <circle cx="100" cy="100" r="62" fill="#22304f" stroke="#14261a" stroke-width="5"></circle>
          <ellipse cx="78" cy="66" rx="26" ry="14" fill="rgba(255,255,255,0.10)" transform="rotate(-32 78 66)"></ellipse>
        </svg>
        <!-- needle -->
        <div style="position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: rotate({{ needleAngle }}deg);">
          <div style="position: absolute; left: -7px; bottom: -4px; width: 14px; height: 86px; border-radius: 999px; background: linear-gradient(180deg, #ffe14d 0%, #f0a820 100%); border: 3px solid #a86a10; box-shadow: inset 0 3px 0 rgba(255,255,255,0.5);"></div>
        </div>
        <!-- hub -->
        <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #ffe9a8 0%, #f0b428 60%, #d1881a 100%); border: 3px solid #a86a10; box-shadow: 0 3px 0 #7d4e0a; display: flex; align-items: center; justify-content: center; font-size: 20px;">🗝️</div>
        <!-- result pop -->
        <sc-if value="{{ showMsg }}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; left: 50%; top: -12px; transform: translateX(-50%) rotate(-3deg); background: {{ msgBg }}; border: 3px solid #14261a; border-radius: 14px; padding: 4px 16px; box-shadow: inset 0 3px 0 rgba(255,255,255,0.4), 0 4px 0 rgba(0,0,0,0.35); z-index: 2;">
            <span style="color: #fff; font-weight: 700; font-size: 22px; white-space: nowrap; text-shadow: -2px 0 0 #14261a, 2px 0 0 #14261a, 0 -2px 0 #14261a, 0 2px 0 #14261a;">{{ msg }}</span>
          </div>
        </sc-if>
      </div>
      <!-- hint -->
      <span style="color: #fff; font-weight: 600; font-size: 17px; text-shadow: -2px 0 0 #14261a, 2px 0 0 #14261a, 0 -2px 0 #14261a, 0 2px 0 #14261a, 0 3px 0 rgba(0,0,0,0.4);">Жми, когда стрелка в зелёной зоне!</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 580, &quot;height&quot;: 460},
  &quot;zoneSize&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 60, &quot;min&quot;: 20, &quot;max&quot;: 120, &quot;step&quot;: 5, &quot;unit&quot;: &quot;°&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Сложность&quot;},
  &quot;speed&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 160, &quot;min&quot;: 60, &quot;max&quot;: 360, &quot;step&quot;: 10, &quot;unit&quot;: &quot;°/с&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Сложность&quot;}
}">
class Component extends DCLogic {
  state = { angle: 0, phase: 'spin', progress: 0, zoneStart: 300, msg: '' };
  startLoop() {
    if (this._loop) return;
    this.t0 = performance.now();
    this._loop = setInterval(() => {
      const speed = this.props.speed ?? 160;
      this.setState({ angle: ((performance.now() - this.t0) / 1000 * speed) % 360 });
    }, 16);
  }
  componentDidMount() { this.startLoop(); }
  componentWillUnmount() { clearInterval(this._loop); }
  reset(p) {
    this.setState({ phase: 'spin', msg: '', progress: p, zoneStart: Math.random() * 360 });
  }
  renderVals() {
    const zone = this.props.zoneSize ?? 60;
    const r = 78, circ = 2 * Math.PI * r;
    const { angle, phase, progress, zoneStart, msg } = this.state;
    if (!this._loop) setTimeout(() => this.startLoop(), 0);
    const stage = phase === 'won' ? 3 : Math.min(progress + 1, 3);
    return {
      needleAngle: angle,
      stageText: stage + ' / 3',
      zoneDash: (circ * zone / 360) + ' ' + circ,
      zoneOffset: -(circ * zoneStart / 360),
      zoneColor: phase === 'miss' ? '#3a8a28' : (phase === 'spin' ? '#52c832' : '#8aff5a'),
      faceColor: phase === 'miss' ? '#5e2020' : (phase === 'won' ? '#1f4d2a' : '#2b3550'),
      showMsg: !!msg, msg,
      msgBg: phase === 'miss' ? 'linear-gradient(180deg, #f06a6a, #c43434)' : 'linear-gradient(180deg, #7ae04d, #48b428)',
      tryPick: () => {
        if (this.state.phase !== 'spin') return;
        const inZone = ((this.state.angle - this.state.zoneStart + 360) % 360) < zone;
        if (inZone) {
          const p = this.state.progress + 1;
          if (p >= 3) {
            this.setState({ phase: 'won', msg: 'ОТКРЫТО! 🎉' });
            setTimeout(() => this.reset(0), 1600);
          } else {
            const hits = ['ЕСТЬ!', 'ТОЧНО!', 'ЩЁЛК!', 'КРАСАВА!', 'В ЯБЛОЧКО!', 'ЧЁТКО!'];
            this.setState({ phase: 'hit', msg: hits[Math.floor(Math.random() * hits.length)], progress: p });
            setTimeout(() => this.reset(p), 700);
          }
        } else {
          const misses = ['МИМО!', 'ПРОМАХ!', 'УПС!', 'НЕ ТУДА!', 'СОРВАЛОСЬ!'];
          this.setState({ phase: 'miss', msg: misses[Math.floor(Math.random() * misses.length)] });
          setTimeout(() => this.reset(0), 700);
        }
      }
    };
  }
}
</script>
</body>
</html>
