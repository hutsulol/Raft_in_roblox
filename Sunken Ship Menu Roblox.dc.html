<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  a { color: #7fc6e8; } a:hover { color: #aadcf2; }
  @keyframes bubbleUp { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: 0.5; } 88% { opacity: 0.5; } 100% { transform: translateY(-78vh); opacity: 0; } }
</style>
</helmet>

<div data-screen-label="Sunken Ship Menu" style="position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; background: radial-gradient(ellipse at 50% 20%, #0d2b45 0%, #071c30 45%, #02090f 100%); font-family: 'M PLUS Rounded 1c', sans-serif;">

  <!-- vignette -->
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.65) 100%); pointer-events: none;"></div>
  {{ bubbles }}

  <!-- surfacing flash on revive -->
  <div style="position: absolute; inset: 0; z-index: 3; background: radial-gradient(ellipse at 50% 30%, #bfeaff 0%, #5db6e6 55%, #1d6ea8 100%); opacity: {{ reviveFlashOpacity }}; transition: opacity 2s ease; pointer-events: none;"></div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px; text-align: center; transform: {{ contentTransform }}; opacity: {{ contentOpacity }}; filter: {{ contentBlur }}; transition: transform 1.8s cubic-bezier(0.5, 0, 0.8, 0.4), opacity 1.8s ease, filter 1.8s ease;">

    <div style="font-weight: 900; font-size: 46px; line-height: 1.1; color: #ffffff; text-shadow: 0 4px 0 #000, 3px 0 0 #000, -3px 0 0 #000, 0 -3px 0 #000, 0 6px 18px rgba(0,0,0,0.8);">Плот пошёл ко дну</div>
    <div style="font-weight: 800; font-size: 20px; color: #7fa8c9; text-shadow: 0 2px 0 #000;">Что дальше, капитан?</div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 34px;">

      <!-- paid revive -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <button onClick="{{ onRevive }}" style="display: flex; align-items: center; gap: 14px; min-width: 380px; box-sizing: border-box; padding: 14px 18px 14px 22px; background: linear-gradient(180deg, #45cc45 0%, #2fa32f 55%, #1f7d1f 100%); border: 4px solid #000; box-shadow: 0 6px 0 rgba(0,0,0,0.55); cursor: pointer; font-family: 'M PLUS Rounded 1c', sans-serif;" style-hover="filter: brightness(1.1);" style-active="transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.55);">
          <div style="flex: 1; text-align: left; font-weight: 900; font-size: 22px; color: #ffffff; text-shadow: 0 2.5px 0 #000, 1.5px 0 0 #000, -1.5px 0 0 #000;">Возродиться командой</div>
          <div style="flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 14px; background: rgba(0,0,0,0.35); border: 3px solid #000;">
            <div style="font-weight: 900; font-size: 18px; color: #ffd23a; text-shadow: 0 1.5px 0 #000;">⬡</div>
            <div style="font-weight: 900; font-size: 20px; color: #ffd23a; text-shadow: 0 1.5px 0 #000;">{{ priceLabel }}</div>
          </div>
        </button>
        <div style="font-weight: 800; font-size: 14px; color: #6f97b8; text-shadow: 0 1.5px 0 #000;">Полное ХП плота, вся команда снова в строю</div>
      </div>

      <!-- exit to lobby -->
      <button onClick="{{ onLeave }}" style="min-width: 380px; box-sizing: border-box; padding: 13px 22px; background: linear-gradient(180deg, #2c4d68 0%, #1d3750 55%, #132638 100%); border: 4px solid #000; box-shadow: 0 6px 0 rgba(0,0,0,0.55); font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 900; font-size: 20px; color: #cfe3f2; text-shadow: 0 2px 0 #000, 1.5px 0 0 #000, -1.5px 0 0 #000; cursor: pointer;" style-hover="filter: brightness(1.15);" style-active="transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.55);">Выйти в лобби</button>

    </div>
  </div>

  <!-- toast stays visible during the exit animations -->
  <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; bottom: 8vh; left: 50%; transform: translateX(-50%); z-index: 4; padding: 7px 16px; background: rgba(0,0,0,0.5); border: 2px solid #ffd23a; font-weight: 900; font-size: 14px; color: #ffd23a; text-shadow: 0 1px 0 #000; white-space: nowrap;">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;revivePrice&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 99, &quot;min&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Монетизация&quot; }
}">
class Component extends DCLogic {
  state = { toast: '', anim: null }; // anim: 'revive' | 'sink' | null

  componentDidMount() {
    this._bubbles = null;
  }

  makeBubbles() {
    if (this._bubbles) return this._bubbles;
    const seeds = [[6,14,9,0],[16,10,12,3],[27,18,8,6],[38,12,14,1.5],[52,16,10,4.5],[63,11,13,2],[74,17,9,5.5],[85,13,12,0.8],[93,19,8,3.8],[45,20,7,7]];
    this._bubbles = React.createElement('div', { key: 'bubbles', style: { position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden' } },
      seeds.map(([left, dur, size, delay], i) => React.createElement('div', {
        key: i,
        style: {
          position: 'absolute', bottom: '-30px', left: left + '%',
          width: size + 'px', height: size + 'px', borderRadius: '50%',
          border: '2px solid rgba(140,200,235,0.55)', background: 'rgba(140,200,235,0.12)',
          animation: 'bubbleUp ' + dur + 's linear ' + delay + 's infinite', opacity: 0
        }
      }))
    );
    return this._bubbles;
  }

  flash(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => this.setState({ toast: '' }), 2200);
  }

  startAnim(kind, msg) {
    if (this.state.anim) return;
    this.flash(msg);
    // set on next frame so the transition runs from the resting state
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ anim: kind })));
    clearTimeout(this._resetT);
    this._resetT = setTimeout(() => this.setState({ anim: null, toast: '' }), 3200);
  }

  renderVals() {
    const price = this.props.revivePrice ?? 99;
    const anim = this.state.anim;
    return {
      bubbles: this.makeBubbles(),
      priceLabel: String(price),
      toast: this.state.toast,
      // revive: menu blurs and dissolves; sink: content drifts up as you go down
      contentTransform: anim === 'sink' ? 'translateY(-120vh)' : (anim === 'revive' ? 'scale(1.15)' : 'none'),
      contentOpacity: anim ? 0 : 1,
      contentBlur: anim === 'revive' ? 'blur(14px)' : 'none',
      reviveFlashOpacity: anim === 'revive' ? 1 : 0,
      onRevive: () => this.startAnim('revive', 'Покупка: возрождение команды за ' + price + ' Robux…'),
      onLeave: () => this.startAnim('sink', '')
    };
  }
}
</script>
</body>
</html>
